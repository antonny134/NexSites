<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexSites</title>
    <style>
        :root{
            --bg: #0a0d13;
            --bg-soft: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(61,220,132,0.10), transparent 60%);
            --surface: #12161f;
            --surface-2: #171c26;
            --border: #232a35;
            --border-soft: #1c222c;
            --green: #3ddc84;
            --green-dim: #2a9d5c;
            --green-glow: rgba(61,220,132,0.35);
            --amber: #ffb454;
            --red: #ff6b6b;
            --text: #e8edf4;
            --text-muted: #8b96a5;
            --text-faint: #5c6675;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --display: 'Space Grotesk', sans-serif;
            --body-font: 'Inter', sans-serif;
            --radius: 12px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background:
                var(--bg-soft),
                var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--body-font);
            color: var(--text);
        }
        ::selection{
            background: var(--green-glow);
            color: #06110b;
        }
        ::-webkit-scrollbar{ width: 10px; height: 10px; }
        ::-webkit-scrollbar-track{ background: var(--bg); }
        ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover{ background: var(--green-dim); }

        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        #tela{
            flex: 1;
        }

        /* ===== Header ===== */
        .logo{
            background: rgba(10,13,19,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text);
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo1{
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-family: var(--display);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo1 h3{ font-weight: 700; }
        .logo1::after{
            content: '_';
            color: var(--green);
            animation: blink 1.1s steps(1) infinite;
            margin-left: 2px;
            font-family: var(--mono);
        }
        @keyframes blink{ 50%{ opacity: 0; } }
        .logo a{
            color: #fff;
            text-decoration: none;
        }
        .s1{ color: #fff; }
        .s2{ color: var(--green); }

        /* ===== Catalog dock ===== */
        .catalogo{
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 8px;
            display: flex;
            gap: 4px;
            background: var(--surface);
            align-items: center;
        }
        .catalogo a{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 999px;
            transition: color 0.18s ease, background 0.18s ease;
        }
        .catalogo a i{
            font-size: 16px;
            line-height: 1;
        }
        .catalogo a span,
        .catalogo a p{
            font-size: 10.5px;
            margin: 0;
            line-height: 1;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .catalogo a:hover{
            color: var(--green);
            background: rgba(61,220,132,0.08);
        }
        .catalogo a:active{
            color: var(--green);
        }
        .catalogo a.hidden{
            display: none;
        }

        /* ===== User status ===== */
        .user-status{
            color: var(--text);
            font-size: 13px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--mono);
        }
        .user-status strong{ color: var(--green); font-weight: 600; }
        .user-status #logoutBtn{
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(255,107,107,0.35);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            font-family: var(--body-font);
            font-weight: 500;
            transition: all 0.18s ease;
        }
        .user-status #logoutBtn:hover{
            background: rgba(255,107,107,0.1);
            border-color: var(--red);
        }

        /* ===== Hero / terminal window ===== */
        #tema-home{
            padding: 26px 20px 10px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== Hero logo banner ===== */
        .hero-logo{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 64px 20px 54px;
            margin-bottom: 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 70px -40px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.02);
        }
        .hero-logo::before{
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 560px 280px at 50% 0%, rgba(61,220,132,0.16), transparent 70%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 26px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 26px);
            pointer-events: none;
        }
        .hero-logo::after{
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            transform: translateX(-50%);
            opacity: 0.7;
        }
        .hero-logo-mark{
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-family: var(--display);
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -0.03em;
            z-index: 1;
            text-shadow: 0 0 40px rgba(61,220,132,0.18);
        }
        .hero-logo-mark::after{
            content: '_';
            color: var(--green);
            animation: blink 1.1s steps(1) infinite;
            margin-left: 2px;
            font-family: var(--mono);
        }
        .hero-logo-mark .s1{ color: var(--text); }
        .hero-logo-mark .s2{ color: var(--green); }
        .hero-logo-sub{
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-faint);
            z-index: 1;
            letter-spacing: 0.01em;
        }

        /* ===== Perfis / Seguir ===== */
        .perfis-section{
            margin-bottom: 30px;
        }
        .perfis-section h3{
            font-family: var(--display);
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            padding: 4px 2px 14px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .perfis-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .perfil-card-mini{
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            animation: rise 0.35s ease both;
        }
        .perfil-card-mini:hover{
            border-color: var(--green-dim);
            transform: translateY(-3px);
            box-shadow: 0 16px 34px -22px rgba(0,0,0,0.6);
        }
        .perfil-card-mini .mini-avatar{
            width: 42px;
            height: 42px;
            border-radius: 12px;
            color: #0b0f0c;
            font-family: var(--display);
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px -4px rgba(0,0,0,0.5);
        }
        .perfil-card-mini .mini-info{
            flex: 1;
            min-width: 0;
        }
        .perfil-card-mini .mini-nome{
            color: var(--text);
            font-family: var(--display);
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .perfil-card-mini .mini-seguidores{
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-faint);
            margin-top: 2px;
        }
        .perfil-card-mini .mini-seguidores strong{
            color: var(--amber);
            font-weight: 600;
        }
        .seguir-btn{
            font-family: var(--body-font);
            font-weight: 600;
            font-size: 12px;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid rgba(61,220,132,0.3);
            background: rgba(61,220,132,0.1);
            color: var(--green);
            flex-shrink: 0;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .seguir-btn:hover{ background: rgba(61,220,132,0.18); transform: translateY(-1px); }
        .seguir-btn:active{ transform: translateY(0); }
        .seguir-btn.seguindo{
            background: var(--surface-2);
            color: var(--text-muted);
            border-color: var(--border);
        }
        .seguir-btn.seguindo:hover{
            background: rgba(255,107,107,0.08);
            color: var(--red);
            border-color: rgba(255,107,107,0.25);
        }
        .seguir-btn.voce-mesmo{
            background: var(--surface-2);
            color: var(--text-faint);
            border-color: var(--border);
            cursor: default;
        }
        .seguir-btn.voce-mesmo:hover{ background: var(--surface-2); }

        /* ===== Listagem de sites ===== */
        .home{
            padding: 6px 20px 40px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }
        .home h3{
            padding: 18px 2px 14px;
            font-size: 18px;
            font-family: var(--display);
            font-weight: 600;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text);
        }
        .sites{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            padding: 16px 0;
        }
        .product-card{
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            animation: rise 0.35s ease both;
            position: relative;
        }
        @keyframes rise{
            from{ opacity: 0; transform: translateY(6px); }
            to{ opacity: 1; transform: translateY(0); }
        }
        .product-card:hover{
            border-color: var(--green-dim);
            transform: translateY(-3px);
            box-shadow: 0 18px 40px -24px rgba(0,0,0,0.65);
        }
        .card-chrome{
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        .card-dots{ display: flex; gap: 5px; flex-shrink: 0; }
        .card-dots span{
            width: 8px; height: 8px; border-radius: 50%;
        }
        .card-dots span:nth-child(1){ background: var(--red); }
        .card-dots span:nth-child(2){ background: var(--amber); }
        .card-dots span:nth-child(3){ background: var(--green); }
        .card-urlbar{
            flex: 1;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 4px 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-body{ padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .product-card h2{
            color: var(--text);
            font-family: var(--display);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-favicon{
            width: 22px; height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--green), var(--green-dim));
            color: #06110b;
            font-size: 12px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-family: var(--display);
            box-shadow: 0 3px 10px -3px rgba(61,220,132,0.5);
        }
        .product-card a{
            color: var(--green);
            text-decoration: none;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 12px;
            word-break: break-all;
        }
        .product-card a:hover{
            text-decoration: underline;
        }
        .product-card p{
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-muted);
        }
        .card-meta{
            font-size: 11px;
            color: var(--text-faint);
            font-family: var(--mono);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-views{
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--amber);
        }
        .card-actions{
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .like-btn, .dislike-btn{
            font-family: var(--body-font);
            font-weight: 600;
            font-size: 12.5px;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .like-btn{
            background: rgba(61,220,132,0.1);
            color: var(--green);
            border-color: rgba(61,220,132,0.25);
        }
        .like-btn:hover{ background: rgba(61,220,132,0.18); transform: translateY(-1px); }
        .dislike-btn{
            background: rgba(255,107,107,0.08);
            color: var(--red);
            border-color: rgba(255,107,107,0.2);
        }
        .dislike-btn:hover{ background: rgba(255,107,107,0.16); transform: translateY(-1px); }
        .comments-btn{
            font-family: var(--body-font);
            font-weight: 600;
            font-size: 12.5px;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .comments-btn:hover{ color: var(--text); border-color: var(--green-dim); }

        /* ===== Comments panel (inside card) ===== */
        .comments-panel{
            margin-top: 12px;
            border-top: 1px solid var(--border-soft);
            padding-top: 12px;
        }
        .comments-list{
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            max-height: 260px;
            overflow-y: auto;
        }
        .comment-item{
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 10px 12px;
        }
        .comment-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 8px;
        }
        .comment-author{
            font-family: var(--display);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
        }
        .comment-date{
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--text-faint);
            flex-shrink: 0;
        }
        .comment-text{
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .comment-reply{
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(61,220,132,0.06);
            border-left: 2px solid var(--green-dim);
            border-radius: 6px;
        }
        .comment-reply-header{
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--green);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .comment-reply p{
            font-size: 12.5px;
            color: var(--text-muted);
        }
        .comment-form{
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .comment-form textarea{
            width: 100%;
            min-height: 60px;
            resize: vertical;
            padding: 10px 12px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: var(--body-font);
            font-size: 13px;
        }
        .comment-form textarea:focus{ border-color: var(--green-dim); }
        .comment-form button{
            align-self: flex-end;
            padding: 7px 16px;
            background: var(--green);
            color: #06110b;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            transition: filter 0.15s ease;
        }
        .comment-form button:hover{ filter: brightness(1.08); }

        .empty-state{
            grid-column: 1/-1;
            color: var(--text-faint);
            font-family: var(--mono);
            font-size: 13px;
            padding: 30px 15px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        /* ===== "precisa logado" gate ===== */
        .gate{
            max-width: 420px;
            margin: 60px auto;
            padding: 28px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .gate h2{
            font-family: var(--display);
            color: var(--text);
            font-size: 19px;
            margin-bottom: 8px;
        }
        .gate p{ color: var(--text-muted); font-size: 13.5px; }

        /* ===== Criar site form (.tela2) ===== */
        .tela2{
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }
        .pts{
            color: var(--text);
            width: 100%;
            max-width: 480px;
        }
        .logo2{
            padding: 0 0 20px;
            text-align: center;
        }
        .logo2 h3{
            font-family: var(--display);
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        .ps{
            margin: 0;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: block;
        }
        .ps label{
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .ps input{
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 6px;
            font-family: var(--body-font);
            font-size: 14px;
        }
        .ps input:focus{ border-color: var(--green-dim); }
        .ps textarea{
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 8px;
            width: 100%;
            height: 100px;
            resize: none;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            font-family: var(--body-font);
            font-size: 14px;
        }
        .ps textarea:focus{ border-color: var(--green-dim); }
        .ps button{
            padding: 11px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            background: var(--green);
            color: #06110b;
            border: none;
            font-weight: 600;
            font-family: var(--body-font);
            transition: filter 0.15s ease;
        }
        .ps button:hover{ filter: brightness(1.08); }
        .ps button:active{ filter: brightness(0.95); }

        /* ===== Result preview ===== */
        .resultado{
            max-width: 480px;
            margin: 30px auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            padding: 20px;
        }
        .resultado h2{
            color: var(--text);
            font-family: var(--display);
            margin-bottom: 8px;
        }
        .resultado a{
            color: var(--green);
            font-family: var(--mono);
            font-size: 13px;
        }

        /* ===== Auth (login / cadastro) ===== */
        .auth-wrap{
            max-width: 400px;
            margin: 40px auto;
            padding: 0 16px;
            color: var(--text);
        }
        .auth-card{
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
        }
        .auth-card h2{
            font-family: var(--display);
            font-size: 21px;
            font-weight: 600;
        }
        .auth-sub{
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }
        .field{ margin-top: 18px; }
        .field label{

// Espelha o menu do topo (#cata) dentro do footer, para telas pequenas.
// Os clones perdem o id (pra não duplicar ids na página) e guardam o
// id original num data-attribute; ao clicar, disparam o clique no
// botão original do topo, reaproveitando toda a lógica já existente.
function prepararCloneFooter() {
    const footerMenu = document.getElementById('footer-menu')
    if (!footerMenu || !cata) return
    footerMenu.innerHTML = ''
    Array.from(cata.children).forEach(el => {
        const clone = el.cloneNode(true)
        if (el.id) clone.dataset.origId = el.id
        if (el.classList.contains('hidden')) clone.classList.add('hidden')
        clone.removeAttribute('id')
        clone.addEventListener('click', (e) => {
            e.preventDefault()
            const original = document.getElementById(clone.dataset.origId)
            if (original) original.click()
        })
        footerMenu.appendChild(clone)
    })
}

let historico = JSON.parse(localStorage.getItem('nex_historico') || '[]')
let usuarios = JSON.parse(localStorage.getItem('nex_usuarios') || '[]')
let comentarios = JSON.parse(localStorage.getItem('nex_comentarios') || '[]')
let seguidoresList = JSON.parse(localStorage.getItem('nex_seguidores') || '[]')
let token = localStorage.getItem('nex_token') || null
let username = localStorage.getItem('nex_user') || null
let hasServer = false

/* =========================================================
   ARMAZENAMENTO COMPARTILHADO (jsonstorage.net)
   -----------------------------------------------------------
   Sem servidor próprio, o localStorage sozinho NUNCA mostra
   sites de outras pessoas (cada navegador só vê o que ele
   mesmo salvou). Para os sites publicados por qualquer
   usuário aparecerem para todo mundo, usamos um "bin" JSON
   gratuito no jsonstorage.net como banco de dados compartilhado.

   COMO ATIVAR (uma única vez):
   1) Abra este arquivo no navegador.
   2) Se CLOUD_BIN_ID estiver vazio, o app cria um bin
      automaticamente na primeira execução e mostra um alerta
      com o ID gerado (também aparece no console - F12).
   3) Copie esse ID e cole aqui embaixo, na constante
      CLOUD_BIN_ID, substituindo a string vazia.
   4) Salve o arquivo. A partir daí, TODOS que abrirem essa
      cópia do arquivo (com o ID já preenchido) vão
      compartilhar a mesma lista de sites.

   Limites do plano grátis: ~1000 requisições/mês e 64kb por
   item. Para um projeto em produção com muito tráfego, o
   ideal seria migrar para Firebase/Supabase.
   ========================================================= */
const CLOUD_BIN_ID = '' // <-- cole aqui o ID gerado (ex: "9f3a.../xxxxxxxx")
const CLOUD_API = 'https://api.jsonstorage.net/v1/json'
let cloudReady = false
let cloudSyncTimer = null
let cloudStatusMsg = 'Ainda não verificado.'

async function cloudGetSites() {
    const res = await fetch(`${CLOUD_API}/${CLOUD_BIN_ID}`)
    if (!res.ok) throw new Error('cloud fetch failed')
    return await res.json()
}

async function cloudSaveSites(sites) {
    if (!CLOUD_BIN_ID) return
    await fetch(`${CLOUD_API}/${CLOUD_BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sites, comentarios })
    })
}

// Junta os comentarios vindos do armazenamento compartilhado com os locais,
// para que cada pessoa veja o que TODO mundo comentou (com o autor de cada um).
function applyCloudComments(data) {
    if (!data || !Array.isArray(data.comentarios)) return
    const porId = new Map()
    comentarios.forEach(c => porId.set(String(c.id), c))
    data.comentarios.forEach(c => porId.set(String(c.id), c))
    comentarios = Array.from(porId.values())
    localStorage.setItem('nex_comentarios', JSON.stringify(comentarios))
}

function scheduleCloudSync() {
    if (!cloudReady) return
    clearTimeout(cloudSyncTimer)
    cloudSyncTimer = setTimeout(() => {
        cloudSaveSites(historico).catch(() => {
            console.warn('Não foi possível sincronizar com o armazenamento compartilhado agora.')
        })
    }, 900)
}

function mostrarAvisoBin(novoId) {
    console.log('%c[NexSites] Bin compartilhado criado! Copie este ID para CLOUD_BIN_ID no código:\n' + novoId, 'color:#3ddc84;font-weight:bold;font-size:13px;')
    alert(
        'Armazenamento compartilhado criado com sucesso!\n\n' +
        'Para que TODOS os visitantes vejam os mesmos sites publicados, copie o ID abaixo e cole na constante CLOUD_BIN_ID no topo do <script> (e salve o arquivo):\n\n' +
        novoId +
        '\n\n(Este ID também foi impresso no console do navegador - F12)'
    )
}

async function initCloudSync() {
    if (CLOUD_BIN_ID) {
        cloudStatusMsg = 'Conectando ao armazenamento compartilhado...'
        atualizarSyncBadge()
        try {
            const data = await cloudGetSites()
            applyCloudComments(data)
            if (data && Array.isArray(data.sites)) {
                historico = data.sites
                normalizeSiteIds(historico)
                localStorage.setItem('nex_historico', JSON.stringify(historico))
            }
            cloudReady = true
            cloudStatusMsg = 'Conectado! Os sites publicados por qualquer pessoa aparecem aqui.'
        } catch (e) {
            cloudReady = false
            cloudStatusMsg = 'Falha ao conectar no bin compartilhado (ID: ' + CLOUD_BIN_ID + ').\nErro: ' + (e && e.message ? e.message : e) +
                '\n\nPossíveis causas: sem internet, ID errado/apagado, ou bloqueio de CORS ao abrir o arquivo direto do disco (tente rodar via um servidor local, ex: "python -m http.server", em vez de dar duplo-clique no arquivo).'
            console.warn('[NexSites] ' + cloudStatusMsg, e)
        }
    } else {
        cloudStatusMsg = 'Criando armazenamento compartilhado pela primeira vez...'
        atualizarSyncBadge()
        try {
            const res = await fetch(CLOUD_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sites: historico })
            })
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ao criar o bin')
            const data = await res.json()
            const match = data.uri && data.uri.match(/\/v1\/json\/(.+)$/)
            const novoId = match ? match[1] : null
            if (novoId) {
                cloudStatusMsg = 'Bin criado! Copie este ID para a constante CLOUD_BIN_ID no código e salve o arquivo:\n\n' + novoId
                mostrarAvisoBin(novoId)
            } else {
                cloudStatusMsg = 'O bin foi criado mas a resposta veio num formato inesperado: ' + JSON.stringify(data)
            }
        } catch (e) {
            cloudStatusMsg = 'Não foi possível criar o armazenamento compartilhado.\nErro: ' + (e && e.message ? e.message : e) +
                '\n\nIsso costuma acontecer quando o arquivo é aberto direto do disco (file://) e o navegador bloqueia a requisição por CORS. ' +
                'Tente: 1) rodar um servidor local (ex: "python -m http.server" na pasta do arquivo e abrir http://localhost:8000/nexsites.html), ' +
                'ou 2) hospedar o arquivo em algo como Netlify/GitHub Pages, ou 3) abrir o Console (F12) e ver o erro exato de rede.'
            console.warn('[NexSites] ' + cloudStatusMsg, e)
        }
        cloudReady = false
    }
}

function atualizarSyncBadge() {
    // Badge removido da interface; mantemos a função como no-op para evitar
    // referências quebradas em rotinas de sincronização que ainda chamam esta API.
}

document.addEventListener('DOMContentLoaded', () => {
    const badge = document.getElementById('syncBadge')
    if (badge) {
        badge.addEventListener('click', async () => {

                alert('Status: ' + cloudStatusMsg)
                return
            }
            const querTentar = confirm((cloudStatusMsg || 'Ainda não verificado.') + '\n\nDeseja tentar conectar/criar o armazenamento compartilhado agora?')
            if (querTentar) {
                badge.innerHTML = '<span class="dot"></span> tentando...'
                await initCloudSync()
            }
        })
    }
})


const HUB_ID = 'nexsites-hub-v1'
let peer = null
let isHub = false
let hubConn = null
let clientConns = {}
let onlineUsers = {}
let reconnectTimer = null
let currentView = 'inicial'

function broadcastToClients(msg, exceptPeerId) {
    Object.keys(clientConns).forEach(pid => {
        if (pid === exceptPeerId) return
        const conn = clientConns[pid]
        if (conn && conn.open) {
            try { conn.send(msg) } catch (e) {}
        }
    })
}

function broadcastRealtime(msg) {
    if (isHub) {
        broadcastToClients(msg)
    } else if (hubConn && hubConn.open) {
        try { hubConn.send(msg) } catch (e) {}
    }
}

function mergeSiteIntoHistorico(site) {
    if (!site || !site.id) return
    const idx = historico.findIndex(s => String(s.id) === String(site.id))
    if (idx !== -1) historico[idx] = site
    else historico.unshift(site)
    localStorage.setItem('nex_historico', JSON.stringify(historico))
    scheduleCloudSync()
    refreshCurrentSitesView()
}

function mergeManySitesIntoHistorico(sites) {
    // usado quando chega uma sincronização completa (full_sync) de outra pessoa,
    // por exemplo logo depois de logar e conectar no hub em tempo real
    if (!Array.isArray(sites) || sites.length === 0) return
    const mapa = {}
    historico.forEach(s => { if (s && s.id != null) mapa[String(s.id)] = s })
    sites.forEach(s => { if (s && s.id != null) mapa[String(s.id)] = s })
    historico = Object.values(mapa).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
    localStorage.setItem('nex_historico', JSON.stringify(historico))
    scheduleCloudSync()
    refreshCurrentSitesView()
}

function refreshCurrentSitesView() {
    if (currentView === 'home' && homeBtn) homeBtn.click()
    else if (currentView === 'meusites' && meusites) meusites.click()
}

function atualizarOnlineBadge() {
    const badge = document.getElementById('onlineBadge')
    if (!badge) return
    const nomes = Object.values(onlineUsers)
    const total = nomes.length
    if (total > 0) {
        badge.style.display = 'flex'
        badge.title = nomes.join(', ')
        badge.innerHTML = '<span class="dot"></span> ' + total + ' online agora'
    } else {
        badge.style.display = 'none'
    }
}

function broadcastPresence() {
    broadcastToClients({ type: 'presence_update', users: Object.assign({}, onlineUsers) })
    atualizarOnlineBadge()
}

function handleIncomingData(conn, data) {
    if (!data || !data.type) return
    if (data.type === 'login') {
        onlineUsers[conn.peer] = data.username
        if (isHub) broadcastPresence()
    } else if (data.type === 'presence_update') {
        onlineUsers = data.users || {}
        if (username && peer) onlineUsers[peer.id] = username
        atualizarOnlineBadge()
    } else if (data.type === 'novo_site' || data.type === 'site_update') {
        mergeSiteIntoHistorico(data.site)
        if (isHub) broadcastToClients(data, conn.peer)
    } else if (data.type === 'full_sync') {
        mergeManySitesIntoHistorico(data.sites)
    }
}

function setupHub() {
    isHub = true
    clientConns = {}
    peer.on('connection', (conn) => {
        clientConns[conn.peer] = conn
        conn.on('open', () => {
            // assim que alguém conecta no hub, manda logo a lista completa
            // de sites já publicados, pra pessoa não precisar esperar uma
            // nova ação de outro usuário pra ver o que já existe
            try { conn.send({ type: 'full_sync', sites: historico }) } catch (e) {}
        })
        conn.on('data', (data) => handleIncomingData(conn, data))
        conn.on('close', () => {
            delete clientConns[conn.peer]
            delete onlineUsers[conn.peer]
            broadcastPresence()
        })
    })
    if (username) {
        onlineUsers[peer.id] = username
        atualizarOnlineBadge()
    }
}

function setupClient() {
    isHub = false
    hubConn = peer.connect(HUB_ID, { reliable: true })
    hubConn.on('open', () => {
        if (username) hubConn.send({ type: 'login', username })
    })
    hubConn.on('data', (data) => handleIncomingData(hubConn, data))
    hubConn.on('close', () => {
        atualizarOnlineBadge()
        agendarReconexao()
    })
    hubConn.on('error', () => {
        agendarReconexao()
    })
}

function agendarReconexao() {
    clearTimeout(reconnectTimer)
    reconnectTimer = setTimeout(() => {
        if (token && username) startRealtime()
    }, 4000)
}

function startRealtime() {
    if (!token || !username) return
    if (peer && !peer.destroyed) return // já conectado/conectando

    if (typeof Peer === 'undefined') {
        console.warn('[NexSites] PeerJS não carregou; recursos em tempo real desativados (sem internet ou CDN bloqueado).')
        return
    }

    try {
        peer = new Peer(HUB_ID)
    } catch (e) {
        console.warn('[NexSites] Não foi possível iniciar o tempo real.', e)
        return
    }

    peer.on('open', () => {
        setupHub()
    })

    peer.on('error', (err) => {
        if (err && err.type === 'unavailable-id') {
            // já existe alguém como hub, conecta como cliente
            try { peer.destroy() } catch (e) {}
            peer = new Peer()
            peer.on('open', () => setupClient())
            peer.on('error', () => agendarReconexao())
        } else {
            console.warn('[NexSites] Erro de conexão em tempo real:', err)
            agendarReconexao()
        }
    })
}

function stopRealtime() {
    clearTimeout(reconnectTimer)
    Object.values(clientConns).forEach(c => { try { c.close() } catch (e) {} })
    clientConns = {}
    if (hubConn) { try { hubConn.close() } catch (e) {} }
    hubConn = null
    if (peer) { try { peer.destroy() } catch (e) {} }
    peer = null
    isHub = false
    onlineUsers = {}
    atualizarOnlineBadge()
}

function normalizeSiteIds(sites) {
    if (!Array.isArray(sites)) return false
    let changed = false
    sites.forEach(site => {
        if (!site) return
        if (site.id == null || site.id === 'undefined') {
            site.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)
            changed = true
        }
        if (typeof site.views !== 'number') {
            site.views = 0
            changed = true
        }
    })
    return changed
}

function hashSenha(senha) {
    let hash = 0
    for (let i = 0; i < senha.length; i++) {
        hash = (hash * 31 + senha.charCodeAt(i)) >>> 0
    }
    return hash.toString(16)
}

function gerarToken() {
    return 'tok_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10)
}

function calcularForcaSenha(senha) {
    let score = 0
    if (senha.length >= 6) score++
    if (senha.length >= 10) score++
    if (/[A-Z]/.test(senha)) score++
    if (/[0-9]/.test(senha)) score++
    if (/[^A-Za-z0-9]/.test(senha)) score++
    return score // 0 a 5
}

function atualizarBarraForca(senha) {
    const bar = document.getElementById('pwBar')
    if (!bar) return
    const score = calcularForcaSenha(senha)
    const pct = (score / 5) * 100
    bar.style.width = pct + '%'
    if (score <= 1) bar.style.background = '#ff6b6b'
    else if (score <= 3) bar.style.background = '#ffb454'
    else bar.style.background = '#3ddc84'
}

function escapeHTML(str) {
    if (str == null) return ''
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
}

function corAvatar(nome) {
    const str = (nome || '?').toLowerCase()
    let hash = 0
    for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0
    }
    const matiz = hash % 360
    const matiz2 = (matiz + 38) % 360
    return `linear-gradient(135deg, hsl(${matiz} 72% 58%), hsl(${matiz2} 62% 42%))`
}

function getDomain(url) {

            const panel = document.getElementById('comments-panel-' + id)
            if (!panel) return
            const isOpen = panel.dataset.open === 'true'

            // Fecha os comentários de todos os outros sites antes de abrir/alternar este
            document.querySelectorAll('.comments-panel').forEach(p => {
                if (p !== panel) {
                    p.dataset.open = 'false'
                    p.style.display = 'none'
                }
            })

            if (isOpen) {
                panel.dataset.open = 'false'
                panel.style.display = 'none'
                return
            }
            panel.innerHTML = renderComentariosPanelHTML(id)
            panel.dataset.open = 'true'
            panel.style.display = 'block'
            attachCommentFormHandler(panel, id)
        }
        btn.addEventListener('click', btn.toggleHandler)
    })
}

function registrarVisualizacao(id) {
    if (hasServer) {
        fetch(`/api/sites/${id}/view`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data && (data.views != null)) {
                    const idx = historico.findIndex(s => String(s.id) === String(id) || String(s.url) === String(id))
                    if (idx !== -1) {
                        historico[idx].views = data.views
                        saveLocal()
                        broadcastRealtime({ type: 'site_update', site: historico[idx] })
                    }
                }
            })
            .catch(() => { hasServer = false })
        return
    }

    const idx = historico.findIndex(s => String(s.id) === String(id) || String(s.url) === String(id))
    if (idx !== -1) {
        historico[idx].views = (historico[idx].views || 0) + 1
        saveLocal()
        broadcastRealtime({ type: 'site_update', site: historico[idx] })
    }
}

    `
    const form = document.getElementById('formulario')
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        let nome = document.getElementById('nome').value.trim()
        let url = document.getElementById('url').value.trim()
        const descri = document.getElementById('descri').value.trim()

        if (!nome || !url) return

        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url
        }

        if (hasServer && token) {
            try {
                const res = await fetch('/api/sites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nome, url, descri })
                })
                if (!res.ok) throw new Error('failed')
                const site = await res.json()
                tela.innerHTML = `<div class="resultado"><h2>${escapeHTML(site.nome)}</h2><strong>Site:</strong> <a href="${escapeHTML(site.url)}" target="_blank">${escapeHTML(site.url)}</a><p><strong>Descrição:</strong> ${escapeHTML(site.descri)}</p></div>`
                loadAndShowSites()
                return
            } catch (err) {
                // fallback to local
                hasServer = false
            }
        }

        // busca a versão mais recente compartilhada antes de inserir, para não sobrescrever
        // sites que outras pessoas publicaram enquanto esta aba estava aberta
        if (cloudReady) {
            try {
                const data = await cloudGetSites()
            applyCloudComments(data)
                if (data && Array.isArray(data.sites)) {
                    historico = data.sites
                }
            } catch (err) { /* segue com a lista local mesmo */ }
        }

        const novoSite = {
            id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            nome, url, descri,
            owner: username,
            likes: 0,
            dislikes: 0,
            views: 0,
            createdAt: new Date().toISOString()
        }
        historico.unshift(novoSite)
        saveLocal()
        broadcastRealtime({ type: 'novo_site', site: novoSite })
        tela.innerHTML = `<div class="resultado"><h2>${escapeHTML(nome)}</h2><strong>Site:</strong> <a href="${escapeHTML(url)}" target="_blank">${escapeHTML(url)}</a><p><strong>Descrição:</strong> ${escapeHTML(descri)}</p></div>`
        loadAndShowSites()
    })
})

perfilBtn.addEventListener('click', async (e) => {
    e.preventDefault()

    if (!token || !username) {
        tela.innerHTML = `
            <div class="gate">
                <h2>Você precisa estar logado</h2>
                <p>Faça login para ver seu perfil.</p>
            </div>
        `

        return
    }

    tela.innerHTML = `
        <div class="perfil-wrap">
            <div class="perfil-header">
                <div class="perfil-avatar" style="background:${corAvatar(username)}">${escapeHTML((username || '?').trim().charAt(0).toUpperCase())}</div>
                <div>
                    <h3>${escapeHTML(username)}</h3>
                    <p>seu perfil na NexSites</p>
                </div>
            </div>
            <div class="perfil-stats" id="perfilStats"></div>
            <h4><i class="bi bi-bar-chart-line"></i> Seus sites mais visualizados</h4>
            <div class="ranking-list" id="rankingViews"></div>
            <h4 style="margin-top:30px;"><i class="bi bi-chat-square-text"></i> Comentários nos seus sites</h4>
            <div class="perfil-comments-list" id="perfilComments"></div>
        </div>
    `

    let meusSites = []

    if (hasServer) {
        try {
            const res = await fetch('/api/sites')
            const sites = await res.json()
            meusSites = sites.filter(s => s.owner === username)
        } catch (e) {
            hasServer = false
        }
    }

    if (!hasServer) {
        if (cloudReady) {
            try {
                const data = await cloudGetSites()
            applyCloudComments(data)
                if (data && Array.isArray(data.sites)) {
                    historico = data.sites
                    localStorage.setItem('nex_historico', JSON.stringify(historico))
                }
            } catch (e) { /* segue com dados locais */ }
        }
        meusSites = historico.filter(s => (s.owner || '').toLowerCase() === username.toLowerCase())
    }

    const totalSites = meusSites.length
    const totalViews = meusSites.reduce((acc, s) => acc + (s.views || 0), 0)
    const totalLikes = meusSites.reduce((acc, s) => acc + (s.likes || 0), 0)

    document.getElementById('perfilStats').innerHTML = `
        <div class="stat-card">
            <div class="stat-num">${totalSites}</div>
            <div class="stat-label">Sites criados</div>
        </div>
        <div class="stat-card">
            <div class="stat-num">${totalViews}</div>
            <div class="stat-label">Visualizações totais</div>
        </div>
        <div class="stat-card">
            <div class="stat-num">${totalLikes}</div>
            <div class="stat-label">Curtidas totais</div>
        </div>
    `

    const rankingDiv = document.getElementById('rankingViews')
    const ordenados = meusSites.slice().sort((a, b) => (b.views || 0) - (a.views || 0))

    if (ordenados.length === 0) {
        rankingDiv.innerHTML = '<p class="empty-state">Você ainda não criou nenhum site.</p>'
    } else {
        rankingDiv.innerHTML = ordenados.map((site, i) => `
            <div class="ranking-item">
                <div class="ranking-pos ${i === 0 ? 'top1' : ''}">#${i + 1}</div>
                <div class="ranking-info">
                    <span class="r-nome">${escapeHTML(site.nome)}</span>
                    <span class="r-url">${escapeHTML(site.url)}</span>
                </div>
                <div class="ranking-views"><i class="bi bi-eye"></i> ${site.views || 0}</div>
            </div>
        `).join('')
    }

    // Comentários recebidos nos sites que este usuário criou
    const perfilComentariosDiv = document.getElementById('perfilComments')
    const meusSiteIds = meusSites.map(s => s.id)
    const comentariosRecebidos = comentarios
        .filter(c => meusSiteIds.some(id => String(id) === String(c.siteId)))
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))

    if (comentariosRecebidos.length === 0) {
        perfilComentariosDiv.innerHTML = '<p class="empty-state">Nenhum comentário recebido ainda.</p>'
    } else {
        perfilComentariosDiv.innerHTML = comentariosRecebidos.map(c => {
            const siteDoComentario = meusSites.find(s => String(s.id) === String(c.siteId))
            const nomeSite = siteDoComentario ? siteDoComentario.nome : 'Site removido'
            return `
                <div class="perfil-comment-card">
                    <div class="perfil-comment-meta">
                        <span class="pc-site"><i class="bi bi-globe2"></i> ${escapeHTML(nomeSite)}</span>
                        <span class="pc-author">por ${escapeHTML(c.author)}</span>
                        <span class="pc-date">${c.createdAt ? escapeHTML(c.createdAt.split('T')[0]) : ''}</span>
                    </div>
                    <p class="perfil-comment-text">${escapeHTML(c.texto)}</p>
                    ${c.resposta ? '<div class="reply-badge"><i class="bi bi-check-circle-fill"></i> Você já respondeu</div>' : ''}
                    <form class="reply-form" data-comment-id="${escapeHTML(c.id)}">
                        <textarea placeholder="Escreva sua resposta...">${c.resposta ? escapeHTML(c.resposta.texto) : ''}</textarea>
                        <button type="submit">${c.resposta ? 'Atualizar resposta' : 'Responder'}</button>
                    </form>
                </div>
            `
        }).join('')

        document.querySelectorAll('.reply-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault()
                const commentId = form.getAttribute('data-comment-id')
                const texto = form.querySelector('textarea').value.trim()
                if (!texto) return

                if (hasServer) {
                    try {
                        await fetch(`/api/comments/${commentId}/reply`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify({ texto })
                        })
                        perfilBtn.click()
                        return
                    } catch (err) { hasServer = false }
                }

                const idx = comentarios.findIndex(cm => String(cm.id) === String(commentId))
                if (idx !== -1) {
                    comentarios[idx].resposta = { texto, createdAt: new Date().toISOString() }
                    saveComentarios()
                }
                perfilBtn.click()
            })
        })
    }
})

procuraBtn.addEventListener('click', (e) => {

        `
    const pesquisa = document.getElementById('pesquisa')
    const doSearch = async () => {
        const valor = pesquisa.value.toLowerCase().trim()
        
        if (!valor) {
            const sitesContainer = document.getElementById('sites')
            if (sitesContainer) {
                sitesContainer.innerHTML = '<p class="empty-state">Digite um termo para buscar sites...</p>'
            }
            return
        }
        
        let encontrados = []
        
        if (hasServer) {
            try {
                const res = await fetch('/api/sites/search?q=' + encodeURIComponent(valor))
                encontrados = await res.json()
            } catch (e) { 
                hasServer = false
                // fallback local
                encontrados = historico.filter(site => 
                    site.nome.toLowerCase().includes(valor) || 
                    (site.descri && site.descri.toLowerCase().includes(valor))
                )
            }
        } else {
            // busca local
            encontrados = historico.filter(site => 
                site.nome.toLowerCase().includes(valor) || 
                (site.descri && site.descri.toLowerCase().includes(valor))
            )
        }
        
        const sitesContainer = document.getElementById('sites')
        if (sitesContainer) {
            sitesContainer.innerHTML = renderSitesHTML(encontrados, 'sites')
            attachLikeHandlers(doSearch)
        }
    }
    
    pesquisa.addEventListener('input', doSearch)
})

loginBtn.addEventListener('click', (e) => {
    e.preventDefault()

                <p class="auth-sub">Entre com suas credenciais</p>

                </form>
                <div id="authMessage" class="auth-msg"></div>
                <hr class="auth-divider">
                <p class="auth-switch">Não tem uma conta? <a href="#" id="linkCadastro">Clique aqui para se cadastrar</a></p>
            </div>
        </div>
    `
    const loginForm = document.getElementById('loginForm')
    const authMessage = document.getElementById('authMessage')
    const linkCadastro = document.getElementById('linkCadastro')

    linkCadastro.addEventListener('click', (e) => {
        e.preventDefault()
        cadastroBtn.click()
    })

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const u = document.getElementById('uuser').value.trim()
        const p = document.getElementById('upass').value.trim()

        if (hasServer) {
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) })
                if (!res.ok) throw new Error('login failed')
                const data = await res.json()
                token = data.token
                username = u
                localStorage.setItem('nex_token', token)
                localStorage.setItem('nex_user', username)
                authMessage.style.color = '#3ddc84'
                authMessage.textContent = '✓ Logado como ' + username
                updateUserStatus()
                renderPerfis()
                startRealtime()
                setTimeout(() => homeBtn.click(), 1200)
                return
            } catch (err) {
                hasServer = false
            }
        }

        // autenticação local
        const userFound = usuarios.find(usr => usr.username.toLowerCase() === u.toLowerCase())
        if (!userFound || userFound.passwordHash !== hashSenha(p)) {
            authMessage.style.color = '#ff6b6b'
            authMessage.textContent = '✗ Erro: usuário ou senha incorretos'
            return
        }

        token = gerarToken()
        username = userFound.username
        localStorage.setItem('nex_token', token)
        localStorage.setItem('nex_user', username)
        authMessage.style.color = '#3ddc84'
        authMessage.textContent = '✓ Logado como ' + username
        updateUserStatus()
        renderPerfis()
        startRealtime()
        setTimeout(() => homeBtn.click(), 1200)
    })
})

    e.preventDefault()
    tela.innerHTML = `
        <div class="auth-wrap">
            <div class="auth-card">

                    </div>

                    </div>

                </form>
                <div id="regMessage" class="auth-msg"></div>
                <hr class="auth-divider">
                <p class="auth-switch">Já tem uma conta? <a href="#" id="linkLogin">Clique aqui para fazer login</a></p>
            </div>
        </div>
    `
    const regForm = document.getElementById('regForm')
    const regMessage = document.getElementById('regMessage')
    const linkLogin = document.getElementById('linkLogin')
    const rpassInput = document.getElementById('rpass')

    rpassInput.addEventListener('input', () => atualizarBarraForca(rpassInput.value))

    linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        loginBtn.click()
    })

    regForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const u = document.getElementById('ruser').value.trim()
        const p = document.getElementById('rpass').value.trim()
        const p2 = document.getElementById('rpass2').value.trim()
        
        if (p !== p2) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: as senhas não correspondem'
            return
        }
        
        if (p.length < 3) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: a senha deve ter no mínimo 3 caracteres'
            return
        }

        if (u.length < 3) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: o usuário deve ter no mínimo 3 caracteres'
            return
        }
        
        if (hasServer) {
            try {
                const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) })
                if (!res.ok) {
                    const err = await res.json()
                    throw new Error(err.error || 'register failed')
                }
                regMessage.style.color = '#3ddc84'
                regMessage.textContent = '✓ Cadastro realizado com sucesso! Redirecionando para login...'
                setTimeout(() => loginBtn.click(), 2000)
                return
            } catch (err) {
                hasServer = false
            }
        }

        // cadastro local
        const existe = usuarios.find(usr => usr.username.toLowerCase() === u.toLowerCase())
        if (existe) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: usuário já existe'
            return
        }

        usuarios.push({ username: u, passwordHash: hashSenha(p), createdAt: new Date().toISOString() })
        saveUsuarios()
        renderPerfis()

        regMessage.style.color = '#3ddc84'
        regMessage.textContent = '✓ Cadastro realizado com sucesso! Redirecionando para login...'
        setTimeout(() => loginBtn.click(), 1500)
    })
});

// inicialização
(async () => {
    try {
        hasServer = await tryDetectServer()
    } catch (e) {
        console.error('Erro ao detectar servidor:', e)
        hasServer = false
    }

    if (!hasServer) {
        try {
            await initCloudSync()
        } catch (e) {
            console.error('Erro ao iniciar sincronização compartilhada:', e)
            cloudReady = false
        }
    }
    
    try {
        updateUserStatus()
    } catch (e) {
        console.error('Erro ao atualizar status do usuário:', e)
    }
    
    try {
        await loadAndShowSites()
    } catch (e) {
        console.error('Erro ao carregar sites:', e)
        // Forçar carregamento local como fallback (sem servidor)
        hasServer = false
        loadAndShowSites()
    }

    try {
        renderPerfis()
    } catch (e) {
        console.error('Erro ao carregar perfis:', e)
    }

    if (token && username) {
        startRealtime()
    }
})()
