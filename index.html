<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexSites</title>
    <style>
        :root{
            --bg: #0a0d13;
            --bg-soft: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(61,220,132,0.10), transparent 60%);
            --surface: #12161f;
            --surface-2: #171c26;
            --border: #232a35;
            --border-soft: #1c222c;
            --green: #3ddc84;
            --green-dim: #2a9d5c;
            --green-glow: rgba(61,220,132,0.35);
            --amber: #ffb454;
            --red: #ff6b6b;
            --text: #e8edf4;
            --text-muted: #8b96a5;
            --text-faint: #5c6675;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --display: 'Space Grotesk', sans-serif;
            --body-font: 'Inter', sans-serif;
            --radius: 12px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background:
                var(--bg-soft),
                var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--body-font);
            color: var(--text);
        }
        ::selection{
            background: var(--green-glow);
            color: #06110b;
        }
        ::-webkit-scrollbar{ width: 10px; height: 10px; }
        ::-webkit-scrollbar-track{ background: var(--bg); }
        ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover{ background: var(--green-dim); }

        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        #tela{
            flex: 1;
        }

        /* ===== Header ===== */
        .logo{
            background: rgba(10,13,19,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text);
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo1{
            display: flex;
            align-items: baseline;
            gap: 2px;
            font-family: var(--display);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo1 h3{ font-weight: 700; }
        .logo1::after{
            content: '_';
            color: var(--green);
            animation: blink 1.1s steps(1) infinite;
            margin-left: 2px;
            font-family: var(--mono);
        }
        @keyframes blink{ 50%{ opacity: 0; } }
        .logo a{
            color: #fff;
            text-decoration: none;
        }
        .s1{ color: #fff; }
        .s2{ color: var(--green); }

        /* ===== Catalog dock ===== */
        .catalogo{
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 8px;
            display: flex;
            gap: 4px;
            background: var(--surface);
            align-items: center;
        }
        .catalogo a{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 999px;
            transition: color 0.18s ease, background 0.18s ease;
        }
        .catalogo a i{
            font-size: 16px;
            line-height: 1;
        }
        .catalogo a span,
        .catalogo a p{
            font-size: 10.5px;
            margin: 0;
            line-height: 1;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .catalogo a:hover{
            color: var(--green);
            background: rgba(61,220,132,0.08);
        }
        .catalogo a:active{
            color: var(--green);
        }

        /* ===== User status ===== */
        .user-status{
            color: var(--text);
            font-size: 13px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--mono);
        }
        .user-status strong{ color: var(--green); font-weight: 600; }
        .user-status #logoutBtn{
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(255,107,107,0.35);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12.5px;
            font-family: var(--body-font);
            font-weight: 500;
            transition: all 0.18s ease;
        }
        .user-status #logoutBtn:hover{
            background: rgba(255,107,107,0.1);
            border-color: var(--red);
        }

        /* ===== Hero / terminal window ===== */
        #tema-home{
            padding: 26px 20px 10px;
        }
        #tema-home a{
            font-family: var(--display);
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            display: block;
            max-width: 620px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 20px 60px -30px rgba(0,0,0,0.6);
            transition: border-color 0.2s ease;
        }
        #tema-home a:hover{
            border-color: var(--green-dim);
        }
        #tema-home a::before{
            content: '';
            display: block;
            height: 34px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            background-image:
                radial-gradient(circle 5px at 18px 17px, var(--red) 98%, transparent 100%),
                radial-gradient(circle 5px at 38px 17px, var(--amber) 98%, transparent 100%),
                radial-gradient(circle 5px at 58px 17px, var(--green) 98%, transparent 100%);
        }
        #tema-home a > span{
            display: block;
            padding: 22px 22px 20px;
            font-size: 19px;
            font-weight: 600;
        }
        #tema-home a > span::before{
            content: '$ nexsites --descobrir';
            display: block;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-faint);
            margin-bottom: 8px;
        }

        #seguidos{ padding: 0 22px 22px; }
        #perfis{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        #perfis #nome{
            font-family: var(--mono);
            font-size: 13px;
            color: var(--text-muted);
        }
        #perfis #nome::before{ content: 'carregando perfil…'; }
        #seguir{
            background: var(--green);
            color: #06110b;
            border: none;
            padding: 7px 16px;
            border-radius: 7px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        #seguidos p{
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 13px;
        }
        .abrir{ max-height: 250px; transition: max-height 0.3s ease; }
        .none{ max-height: 0; overflow: hidden; }

        /* ===== Section headers ===== */
        .home{
            padding: 6px 20px 40px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }
        .home h3{
            padding: 18px 2px 14px;
            font-size: 18px;
            font-family: var(--display);
            font-weight: 600;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text);
        }

        /* ===== Site cards (browser-window motif) ===== */
        .sites{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            padding: 16px 0;
        }
        .product-card{
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease, transform 0.2s ease;
            animation: rise 0.35s ease both;
        }
        @keyframes rise{
            from{ opacity: 0; transform: translateY(6px); }
            to{ opacity: 1; transform: translateY(0); }
        }
        .product-card:hover{
            border-color: var(--green-dim);
            transform: translateY(-2px);
        }
        .card-chrome{
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        .card-dots{ display: flex; gap: 5px; flex-shrink: 0; }
        .card-dots span{
            width: 8px; height: 8px; border-radius: 50%;
        }
        .card-dots span:nth-child(1){ background: var(--red); }
        .card-dots span:nth-child(2){ background: var(--amber); }
        .card-dots span:nth-child(3){ background: var(--green); }
        .card-urlbar{
            flex: 1;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-faint);
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 4px 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-body{ padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .product-card h2{
            color: var(--text);
            font-family: var(--display);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-favicon{
            width: 22px; height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--green), var(--green-dim));
            color: #06110b;
            font-size: 12px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-family: var(--display);
        }
        .product-card a{
            color: var(--green);
            text-decoration: none;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 12px;
            word-break: break-all;
        }
        .product-card a:hover{
            text-decoration: underline;
        }
        .product-card p{
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-muted);
        }
        .card-meta{
            font-size: 11px;
            color: var(--text-faint);
            font-family: var(--mono);
            margin-top: 2px;
        }
        .card-actions{
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .like-btn, .dislike-btn{
            font-family: var(--body-font);
            font-weight: 600;
            font-size: 12.5px;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .like-btn{
            background: rgba(61,220,132,0.1);
            color: var(--green);
            border-color: rgba(61,220,132,0.25);
        }
        .like-btn:hover{ background: rgba(61,220,132,0.18); }
        .dislike-btn{
            background: rgba(255,107,107,0.08);
            color: var(--red);
            border-color: rgba(255,107,107,0.2);
        }
        .dislike-btn:hover{ background: rgba(255,107,107,0.16); }

        .empty-state{
            grid-column: 1/-1;
            color: var(--text-faint);
            font-family: var(--mono);
            font-size: 13px;
            padding: 30px 15px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        /* ===== "precisa logado" gate ===== */
        .gate{
            max-width: 420px;
            margin: 60px auto;
            padding: 28px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .gate h2{
            font-family: var(--display);
            color: var(--text);
            font-size: 19px;
            margin-bottom: 8px;
        }
        .gate p{ color: var(--text-muted); font-size: 13.5px; }

        /* ===== Criar site form (.tela2) ===== */
        .tela2{
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }
        .pts{
            color: var(--text);
            width: 100%;
            max-width: 480px;
        }
        .logo2{
            padding: 0 0 20px;
            text-align: center;
        }
        .logo2 h3{
            font-family: var(--display);
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        .ps{
            margin: 0;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: block;
        }
        .ps label{
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .ps input{
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 6px;
            font-family: var(--body-font);
            font-size: 14px;
        }
        .ps input:focus{ border-color: var(--green-dim); }
        .ps textarea{
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 8px;
            width: 100%;
            height: 100px;
            resize: none;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            font-family: var(--body-font);
            font-size: 14px;
        }
        .ps textarea:focus{ border-color: var(--green-dim); }
        .ps button{
            padding: 11px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            background: var(--green);
            color: #06110b;
            border: none;
            font-weight: 600;
            font-family: var(--body-font);
            transition: filter 0.15s ease;
        }
        .ps button:hover{ filter: brightness(1.08); }
        .ps button:active{ filter: brightness(0.95); }

        /* ===== Result preview ===== */
        .resultado{
            max-width: 480px;
            margin: 30px auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            padding: 20px;
        }
        .resultado h2{
            color: var(--text);
            font-family: var(--display);
            margin-bottom: 8px;
        }
        .resultado a{
            color: var(--green);
            font-family: var(--mono);
            font-size: 13px;
        }

        /* ===== Auth (login / cadastro) ===== */
        .auth-wrap{
            max-width: 400px;
            margin: 40px auto;
            padding: 0 16px;
            color: var(--text);
        }
        .auth-card{
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
        }
        .auth-card h2{
            font-family: var(--display);
            font-size: 21px;
            font-weight: 600;
        }
        .auth-sub{
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
        }
        .field{ margin-top: 18px; }
        .field label{
            display: block;
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .field input{
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-family: var(--body-font);
        }
        .field input:focus{ border-color: var(--green-dim); }
        .btn-primary{
            width: 100%;
            padding: 11px;
            background: var(--green);
            color: #06110b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-top: 20px;
            font-family: var(--body-font);
            transition: filter 0.15s ease;
        }
        .btn-primary:hover{ filter: brightness(1.08); }
        .auth-msg{ margin-top: 14px; font-size: 13px; font-family: var(--mono); min-height: 16px; }
        .auth-divider{ margin: 22px 0; border: none; border-top: 1px solid var(--border-soft); }
        .auth-switch{ color: var(--text-muted); font-size: 13px; }
        .auth-switch a{
            color: var(--green);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }
        .auth-switch a:hover{ text-decoration: underline; }

        /* password strength */
        .pw-strength{
            height: 5px;
            border-radius: 4px;
            margin-top: 8px;
            margin-bottom: 2px;
            background: var(--border);
            overflow: hidden;
        }
        .pw-strength-bar{
            height: 100%;
            width: 0%;
            background: var(--red);
            transition: width 0.3s, background 0.3s;
        }

        /* ===== Search ===== */
        .procurar{
            display: flex;
            justify-content: center;
            margin-top: 26px;
            padding: 0 16px;
            align-items: center;
        }
        .procurar input{
            padding: 12px 18px;
            border-radius: 999px;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: var(--body-font);
            font-size: 14px;
        }
        .procurar input:focus{ border-color: var(--green-dim); }
        .procurar ::placeholder{
            font-size: 14px;
            color: var(--text-faint);
        }

        /* ===== Footer ===== */
        footer{
            margin-top: 40px;
            padding: 18px 20px;
            border-top: 1px solid var(--border-soft);
            color: var(--text-faint);
            font-size: 12.5px;
            font-family: var(--mono);
            z-index: 1000;
            background: var(--bg);
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce){
            *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }

        @media (max-width: 560px){
            .logo{ padding: 12px 14px; }
            .catalogo{ overflow-x: auto; max-width: 100%; margin: auto; display: flex;}
            .catalogo a{ padding: 7px 9px; }
            .sites{ grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <nav class="logo">
     <div class="logo1">
        <h3 class="s1">Nex</h3>
        <h3 class="s2">Sites</h3>
        <!-- Catalogo -->
    </div>
      <div class="catalogo" id="cata">
            <a href="#" id="home">
                <i class="bi bi-grid"></i>
                <span>Sites Populares</span>
            </a>
            <a href="#" id="criar" >
                <i class="bi bi-plus-circle"></i>
                <p>Criar</p>
            </a>
            <a href="#" id="cadastro">
                 <i class="bi bi-person-plus"></i>
                <p>Cadastro</p>
            </a>
            <a href="#" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Login</span>
            </a>
            <a href="#" id="procurar">
                <i class="bi bi-search"></i>
                <span>Procurar</span>
            </a>
            <a href="#" id="meusites">
                <i class="bi bi-folder2-open"></i>
                <span>Meus Sites</span>
            </a>
         </div>
    </nav>
    <!-- Tela -->
     <nav id="tela">
        <div id="tema-home">
            <!-- Quem somos -->
             <a href="#" id="somos">
                <span>Os perfis mais seguidos</span>
                <div id="seguidos"></div>
             </a>
        </div>
     </nav>
     <script>
var seguidores = 10

const seguidos = document.getElementById("seguidos")
const temahome = document.getElementById("tema-home")
const somos = document.getElementById("somos")
const tela = document.getElementById("tela")
const criar = document.getElementById("criar")
const meusites = document.getElementById("meusites")
const procuraBtn = document.getElementById("procurar")
const loginBtn = document.getElementById("loginBtn")
const cadastroBtn = document.getElementById("cadastro")
const cata = document.getElementById("cata")

let historico = JSON.parse(localStorage.getItem('nex_historico') || '[]')
let usuarios = JSON.parse(localStorage.getItem('nex_usuarios') || '[]')
let token = localStorage.getItem('nex_token') || null
let username = localStorage.getItem('nex_user') || null
let hasServer = false

function normalizeSiteIds(sites) {
    if (!Array.isArray(sites)) return false
    let changed = false
    sites.forEach(site => {
        if (!site) return
        if (site.id == null || site.id === 'undefined') {
            site.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)
            changed = true
        }
    })
    return changed
}

if (normalizeSiteIds(historico)) {
    saveLocal()
}
 // tema-menu

    temahome.addEventListener("click", function () {
    somos.classList.toggle("abrir");

    if (seguidores >= 0) {
        seguidos.innerHTML = `
            <div id="perfis">
                <p id="nome"></p>
                <button id="seguir">Seguir</button>
            </div>
        `;
    } else {
        alert("oi")
        somos.style.height = '125px' 
        seguidos.innerHTML = '<p>Niguém tem mais de 10 iscritos</p>'
    }
});

async function tryDetectServer() {
    try {
        const res = await fetch('/api/sites')
        if (!res.ok) throw new Error('no api')
        return true
    } catch (e) {
        return false
    }
}

function saveLocal() {
    localStorage.setItem('nex_historico', JSON.stringify(historico))
}

function saveUsuarios() {
    localStorage.setItem('nex_usuarios', JSON.stringify(usuarios))
}

function hashSenha(senha) {
    let hash = 0
    for (let i = 0; i < senha.length; i++) {
        hash = (hash * 31 + senha.charCodeAt(i)) >>> 0
    }
    return hash.toString(16)
}

function gerarToken() {
    return 'tok_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10)
}

function calcularForcaSenha(senha) {
    let score = 0
    if (senha.length >= 6) score++
    if (senha.length >= 10) score++
    if (/[A-Z]/.test(senha)) score++
    if (/[0-9]/.test(senha)) score++
    if (/[^A-Za-z0-9]/.test(senha)) score++
    return score // 0 a 5
}

function atualizarBarraForca(senha) {
    const bar = document.getElementById('pwBar')
    if (!bar) return
    const score = calcularForcaSenha(senha)
    const pct = (score / 5) * 100
    bar.style.width = pct + '%'
    if (score <= 1) bar.style.background = '#ff6b6b'
    else if (score <= 3) bar.style.background = '#ffb454'
    else bar.style.background = '#3ddc84'
}

function escapeHTML(str) {
    if (str == null) return ''
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
}

function getDomain(url) {
    try {
        return new URL(url).hostname.replace(/^www\./, '')
    } catch (e) {
        return url || ''
    }
}

function updateUserStatus() {
    // Limpar status anterior
    const oldStatus = document.querySelector('.user-status')
    if (oldStatus) oldStatus.remove()
    
    if (token && username) {
        // Inserir status de usuário logado
        const catalogo = document.querySelector('.catalogo')
        const statusDiv = document.createElement('div')
        statusDiv.className = 'user-status'
        statusDiv.innerHTML = `
            <span>Logado como <strong>${escapeHTML(username)}</strong></span>
            <button id="logoutBtn">Sair</button>
        `
        catalogo.parentElement.insertBefore(statusDiv, catalogo)
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            token = null
            username = null
            localStorage.removeItem('nex_token')
            localStorage.removeItem('nex_user')
            updateUserStatus()
            loadAndShowSites()
        })
    }
}

function renderSitesHTML(sitesArray, containerId) {
    if (!sitesArray || sitesArray.length === 0) {
        return '<p class="empty-state">Nenhum site encontrado.</p>'
    }
    let html = ''
    sitesArray.forEach(site => {
        const stableId = site.id || site.url || 'site_' + Math.random().toString(36).slice(2, 8)
        const domain = getDomain(site.url)
        const initial = (site.nome || '?').trim().charAt(0).toUpperCase() || '?'
        html += `
            <div class="product-card">
                <div class="card-chrome">
                    <div class="card-dots"><span></span><span></span><span></span></div>
                    <div class="card-urlbar">${escapeHTML(domain)}</div>
                </div>
                <div class="card-body">
                    <h2><span class="card-favicon">${escapeHTML(initial)}</span>${escapeHTML(site.nome)}</h2>
                    <a href="${escapeHTML(site.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(site.url)}</a>
                    <p>${escapeHTML(site.descri || '')}</p>
                    <div class="card-meta">enviado por ${escapeHTML(site.owner || 'local')} · ${site.createdAt ? escapeHTML(site.createdAt.split('T')[0]) : ''}</div>
                    <div class="card-actions">
                        <button class="like-btn" data-id="${escapeHTML(stableId)}">👍 ${site.likes || 0}</button>
                        <button class="dislike-btn" data-id="${escapeHTML(stableId)}">👎 ${site.dislikes || 0}</button>
                    </div>
                </div>
            </div>
        `
    })
    return html
}

function attachLikeHandlers(callback) {
    document.querySelectorAll('.like-btn').forEach(btn => {
        btn.removeEventListener('click', btn.clickHandler)
        btn.clickHandler = async (e) => {
            const id = btn.getAttribute('data-id')
            if (!token) {
                alert('Faça login para curtir sites')
                return
            }
            if (hasServer) {
                try {
                    await fetch(`/api/sites/${id}/like`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
                    if (callback) callback()
                    return
                } catch (err) { hasServer = false }
            }
            const idx = historico.findIndex(s => String(s.id) === String(id) || String(s.url) === String(id))
            if (idx !== -1) {
                historico[idx].likes = (historico[idx].likes || 0) + 1
                saveLocal()
                if (callback) callback()
            }
        }
        btn.addEventListener('click', btn.clickHandler)
    })
    document.querySelectorAll('.dislike-btn').forEach(btn => {
        btn.removeEventListener('click', btn.clickHandler)
        btn.clickHandler = async (e) => {
            const id = btn.getAttribute('data-id')
            if (!token) {
                alert('Faça login para descurtir sites')
                return
            }
            if (hasServer) {
                try {
                    await fetch(`/api/sites/${id}/dislike`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
                    if (callback) callback()
                    return
                } catch (err) { hasServer = false }
            }
            const idx = historico.findIndex(s => String(s.id) === String(id) || String(s.url) === String(id))
            if (idx !== -1) {
                historico[idx].dislikes = (historico[idx].dislikes || 0) + 1
                saveLocal()
                if (callback) callback()
            }
        }
        btn.addEventListener('click', btn.clickHandler)
    })
}

function showSitesList(sitesArray) {
    const sitesContainer = document.getElementById('sites')
    if (!sitesContainer) return
    sitesContainer.innerHTML = renderSitesHTML(sitesArray, 'sites')
    attachLikeHandlers(() => loadAndShowSites())
}

async function loadAndShowSites() {
    if (hasServer) {
        try {
            // show popular on home
            const res = await fetch('/api/sites/popular')
            const sites = await res.json()
            showSitesList(sites)
            return
        } catch (e) {
            hasServer = false
        }
    }
    // fallback local
    // show top 10 by likes locally
    const sorted = historico.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0))
    showSitesList(sorted.slice(0, 10))
}

criar.addEventListener('click', (e) => {
    e.preventDefault()

    if (!token || !username) {
        tela.innerHTML = `
            <div class="gate">
                <h2>Você precisa estar logado</h2>
                <p>Faça login ou crie uma conta para lançar um site.</p>
            </div>
        `
        setTimeout(() => loginBtn.click(), 1200)
        return
    }

    tela.innerHTML = `
        <nav class="tela2">
                <div class="pts">
                        <div class="logo2">
                                <h3>PUBLIQUE SEU SITE PARA TODO MUNDO</h3>
                        </div>
                        <div class="ps">
                                <form id="formulario">
                                        <label>NOME DO SITE:</label><br>
                                        <input type="text"  required id="nome">
                                        <br><br>
                                        <label>URL DO SITE:</label><br>
                                        <input type="text"required id="url">
                                        <br><br>
                                        <label>DESCRIÇÃO</label><br>
                                        <textarea required id="descri"></textarea>
                                        <br><br>
                                        <button type="submit">Enviar</button>
                                </form>
                        </div>
                </div>
        </nav>
    `
    const form = document.getElementById('formulario')
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        let nome = document.getElementById('nome').value.trim()
        let url = document.getElementById('url').value.trim()
        const descri = document.getElementById('descri').value.trim()

        if (!nome || !url) return

        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url
        }

        if (hasServer && token) {
            try {
                const res = await fetch('/api/sites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nome, url, descri })
                })
                if (!res.ok) throw new Error('failed')
                const site = await res.json()
                tela.innerHTML = `<div class="resultado"><h2>${escapeHTML(site.nome)}</h2><strong>Site:</strong> <a href="${escapeHTML(site.url)}" target="_blank">${escapeHTML(site.url)}</a><p><strong>Descrição:</strong> ${escapeHTML(site.descri)}</p></div>`
                loadAndShowSites()
                return
            } catch (err) {
                // fallback to local
                hasServer = false
            }
        }

        const novoSite = {
            id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
            nome, url, descri,
            owner: username,
            likes: 0,
            dislikes: 0,
            createdAt: new Date().toISOString()
        }
        historico.unshift(novoSite)
        saveLocal()
        tela.innerHTML = `<div class="resultado"><h2>${escapeHTML(nome)}</h2><strong>Site:</strong> <a href="${escapeHTML(url)}" target="_blank">${escapeHTML(url)}</a><p><strong>Descrição:</strong> ${escapeHTML(descri)}</p></div>`
        loadAndShowSites()
    })
})

    `

            showSitesList(mine)
            return

procuraBtn.addEventListener('click', (e) => {
    e.preventDefault()
    tela.innerHTML = `
         <div class="procurar">
                <input type="text" placeholder="Procurar Sites..." id="pesquisa">
        </div>
         <nav class="sites" id="sites" style="max-width:1100px;margin:0 auto;padding:16px 20px;"></nav>
        `
    const pesquisa = document.getElementById('pesquisa')
    const doSearch = async () => {
        const valor = pesquisa.value.toLowerCase().trim()
        
        if (!valor) {
            const sitesContainer = document.getElementById('sites')
            if (sitesContainer) {
                sitesContainer.innerHTML = '<p class="empty-state">Digite um termo para buscar sites...</p>'
            }
            return
        }
        
        let encontrados = []
        
        if (hasServer) {
            try {
                const res = await fetch('/api/sites/search?q=' + encodeURIComponent(valor))
                encontrados = await res.json()
            } catch (e) { 
                hasServer = false
                // fallback local
                encontrados = historico.filter(site => 
                    site.nome.toLowerCase().includes(valor) || 
                    (site.descri && site.descri.toLowerCase().includes(valor))
                )
            }
        } else {
            // busca local
            encontrados = historico.filter(site => 
                site.nome.toLowerCase().includes(valor) || 
                (site.descri && site.descri.toLowerCase().includes(valor))
            )
        }
        
        const sitesContainer = document.getElementById('sites')
        if (sitesContainer) {
            sitesContainer.innerHTML = renderSitesHTML(encontrados, 'sites')
            attachLikeHandlers(doSearch)
        }
    }
    
    pesquisa.addEventListener('input', doSearch)
})

loginBtn.addEventListener('click', (e) => {
    e.preventDefault()
    tela.innerHTML = `
        <div class="auth-wrap">
            <div class="auth-card">
                <h2>Login</h2>
                <p class="auth-sub">Entre com suas credenciais</p>
                <form id="loginForm">
                    <div class="field">
                        <label>Usuário</label>
                        <input id="uuser" required>
                    </div>
                    <div class="field">
                        <label>Senha</label>
                        <input id="upass" type="password" required>
                    </div>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
                <div id="authMessage" class="auth-msg"></div>
                <hr class="auth-divider">
                <p class="auth-switch">Não tem uma conta? <a href="#" id="linkCadastro">Clique aqui para se cadastrar</a></p>
            </div>
        </div>
    `
    const loginForm = document.getElementById('loginForm')
    const authMessage = document.getElementById('authMessage')
    const linkCadastro = document.getElementById('linkCadastro')

    linkCadastro.addEventListener('click', (e) => {
        e.preventDefault()
        cadastroBtn.click()
    })

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const u = document.getElementById('uuser').value.trim()
        const p = document.getElementById('upass').value.trim()

        if (hasServer) {
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) })
                if (!res.ok) throw new Error('login failed')
                const data = await res.json()
                token = data.token
                username = u
                localStorage.setItem('nex_token', token)
                localStorage.setItem('nex_user', username)
                authMessage.style.color = '#3ddc84'
                authMessage.textContent = '✓ Logado como ' + username
                updateUserStatus()
                setTimeout(() => homeBtn.click(), 1200)
                return
            } catch (err) {
                hasServer = false
            }
        }

        // autenticação local
        const userFound = usuarios.find(usr => usr.username.toLowerCase() === u.toLowerCase())
        if (!userFound || userFound.passwordHash !== hashSenha(p)) {
            authMessage.style.color = '#ff6b6b'
            authMessage.textContent = '✗ Erro: usuário ou senha incorretos'
            return
        }

        token = gerarToken()
        username = userFound.username
        localStorage.setItem('nex_token', token)
        localStorage.setItem('nex_user', username)
        authMessage.style.color = '#3ddc84'
        authMessage.textContent = '✓ Logado como ' + username
        updateUserStatus()
        setTimeout(() => homeBtn.click(), 1200)
    })
})

cadastroBtn.addEventListener('click', (e) => {
    e.preventDefault()
    tela.innerHTML = `
        <div class="auth-wrap">
            <div class="auth-card">
                <h2>Criar Conta</h2>
                <p class="auth-sub">Preencha os dados abaixo para criar sua conta</p>
                <form id="regForm">
                    <div class="field">
                        <label>Usuário</label>
                        <input id="ruser" placeholder="Escolha um nome de usuário" required>
                    </div>
                    <div class="field">
                        <label>Senha</label>
                        <input id="rpass" type="password" placeholder="Crie uma senha forte" required>
                        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
                    </div>
                    <div class="field">
                        <label>Confirmar Senha</label>
                        <input id="rpass2" type="password" placeholder="Repita sua senha" required>
                    </div>
                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>
                <div id="regMessage" class="auth-msg"></div>
                <hr class="auth-divider">
                <p class="auth-switch">Já tem uma conta? <a href="#" id="linkLogin">Clique aqui para fazer login</a></p>
            </div>
        </div>
    `
    const regForm = document.getElementById('regForm')
    const regMessage = document.getElementById('regMessage')
    const linkLogin = document.getElementById('linkLogin')
    const rpassInput = document.getElementById('rpass')

    rpassInput.addEventListener('input', () => atualizarBarraForca(rpassInput.value))

    linkLogin.addEventListener('click', (e) => {
        e.preventDefault()
        loginBtn.click()
    })

    regForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const u = document.getElementById('ruser').value.trim()
        const p = document.getElementById('rpass').value.trim()
        const p2 = document.getElementById('rpass2').value.trim()
        
        if (p !== p2) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: as senhas não correspondem'
            return
        }
        
        if (p.length < 3) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: a senha deve ter no mínimo 3 caracteres'
            return
        }

        if (u.length < 3) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: o usuário deve ter no mínimo 3 caracteres'
            return
        }
        
        if (hasServer) {
            try {
                const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) })
                if (!res.ok) {
                    const err = await res.json()
                    throw new Error(err.error || 'register failed')
                }
                regMessage.style.color = '#3ddc84'
                regMessage.textContent = '✓ Cadastro realizado com sucesso! Redirecionando para login...'
                setTimeout(() => loginBtn.click(), 2000)
                return
            } catch (err) {
                hasServer = false
            }
        }

        // cadastro local
        const existe = usuarios.find(usr => usr.username.toLowerCase() === u.toLowerCase())
        if (existe) {
            regMessage.style.color = '#ff6b6b'
            regMessage.textContent = '✗ Erro: usuário já existe'
            return
        }

        usuarios.push({ username: u, passwordHash: hashSenha(p), createdAt: new Date().toISOString() })
        saveUsuarios()

        regMessage.style.color = '#3ddc84'
        regMessage.textContent = '✓ Cadastro realizado com sucesso! Redirecionando para login...'
        setTimeout(() => loginBtn.click(), 1500)
    })
})

    try {
        hasServer = await tryDetectServer()
    } catch (e) {
        console.error('Erro ao detectar servidor:', e)
        hasServer = false
    }
    
    try {
        updateUserStatus()
    } catch (e) {
        console.error('Erro ao atualizar status do usuário:', e)
    }
    
    try {
        await loadAndShowSites()
    } catch (e) {
        console.error('Erro ao carregar sites:', e)
        // Forçar carregamento local como fallback (sem servidor)
        hasServer = false
        loadAndShowSites()
    }
})()
