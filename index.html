<!doctype html>
<html lang="pt-br">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexSites</title>
    <style>
      :root {
        --bg: #0a0d13;
        --bg-soft: radial-gradient(
          ellipse 900px 500px at 50% -10%,
          rgba(61, 220, 132, 0.1),
          transparent 60%
        );
        --surface: #12161f;
        --surface-2: #171c26;
        --border: #232a35;
        --border-soft: #1c222c;
        --green: #3ddc84;
        --green-dim: #2a9d5c;
        --green-glow: rgba(61, 220, 132, 0.35);
        --amber: #ffb454;
        --red: #ff6b6b;
        --text: #e8edf4;
        --text-muted: #8b96a5;
        --text-faint: #5c6675;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --display: "Space Grotesk", sans-serif;
        --body-font: "Inter", sans-serif;
        --radius: 12px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-soft), var(--bg);
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: var(--body-font);
        color: var(--text);
      }
      ::selection {
        background: var(--green-glow);
        color: #06110b;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--green-dim);
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }

      #tela {
        flex: 1;
      }

      /* ===== Header ===== */
      .logo {
        background: rgba(10, 13, 19, 0.85);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-soft);
        color: var(--text);
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .logo1 {
        display: flex;
        align-items: baseline;
        gap: 2px;
        font-family: var(--display);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .logo1 h3 {
        font-weight: 700;
      }
      .logo1::after {
        content: "_";
        color: var(--green);
        animation: blink 1.1s steps(1) infinite;
        margin-left: 2px;
        font-family: var(--mono);
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .logo a {
        color: #fff;
        text-decoration: none;
      }
      .s1 {
        color: #fff;
      }
      .s2 {
        color: var(--green);
      }

      /* ===== Catalog dock ===== */
      .catalogo {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 8px;
        display: flex;
        gap: 4px;
        background: var(--surface);
        align-items: center;
      }
      .catalogo a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        text-align: center;
        color: var(--text-muted);
        text-decoration: none;
        padding: 7px 12px;
        border-radius: 999px;
        transition:
          color 0.18s ease,
          background 0.18s ease;
      }
      .catalogo a i {
        font-size: 16px;
        line-height: 1;
      }
      .catalogo a span,
      .catalogo a p {
        font-size: 10.5px;
        margin: 0;
        line-height: 1;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .catalogo a:hover {
        color: var(--green);
        background: rgba(61, 220, 132, 0.08);
      }
      .catalogo a:active {
        color: var(--green);
      }
      .catalogo a.hidden {
        display: none;
      }

      /* ===== User status ===== */
      .user-status {
        color: var(--text);
        font-size: 13px;
        margin-right: 15px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--mono);
      }
      .user-status strong {
        color: var(--green);
        font-weight: 600;
      }
      .user-status #logoutBtn {
        background: transparent;
        color: var(--red);
        border: 1px solid rgba(255, 107, 107, 0.35);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12.5px;
        font-family: var(--body-font);
        font-weight: 500;
        transition: all 0.18s ease;
      }
      .user-status #logoutBtn:hover {
        background: rgba(255, 107, 107, 0.1);
        border-color: var(--red);
      }

      /* ===== Hero / terminal window ===== */
      #tema-home {
        padding: 26px 20px 10px;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }

      /* ===== Hero logo banner ===== */
      .hero-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
        padding: 64px 20px 54px;
        margin-bottom: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        position: relative;
        overflow: hidden;
        box-shadow:
          0 30px 70px -40px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.02);
      }
      .hero-logo::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 560px 280px at 50% 0%,
            rgba(61, 220, 132, 0.16),
            transparent 70%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.018) 0px,
            rgba(255, 255, 255, 0.018) 1px,
            transparent 1px,
            transparent 26px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.018) 0px,
            rgba(255, 255, 255, 0.018) 1px,
            transparent 1px,
            transparent 26px
          );
        pointer-events: none;
      }
      .hero-logo::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 140px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--green),
          transparent
        );
        transform: translateX(-50%);
        opacity: 0.7;
      }
      .hero-logo-mark {
        display: flex;
        align-items: baseline;
        gap: 2px;
        font-family: var(--display);
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.03em;
        z-index: 1;
        text-shadow: 0 0 40px rgba(61, 220, 132, 0.18);
      }
      .hero-logo-mark::after {
        content: "_";
        color: var(--green);
        animation: blink 1.1s steps(1) infinite;
        margin-left: 2px;
        font-family: var(--mono);
      }
      .hero-logo-mark .s1 {
        color: var(--text);
      }
      .hero-logo-mark .s2 {
        color: var(--green);
      }
      .hero-logo-sub {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-faint);
        z-index: 1;
        letter-spacing: 0.01em;
      }

      /* ===== Perfis / Seguir ===== */
      .perfis-section {
        margin-bottom: 30px;
      }
      .perfis-section h3 {
        font-family: var(--display);
        font-size: 17px;
        font-weight: 600;
        color: var(--text);
        padding: 4px 2px 14px;
        border-bottom: 1px solid var(--border-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .perfis-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .perfil-card-mini {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        animation: rise 0.35s ease both;
      }
      .perfil-card-mini:hover {
        border-color: var(--green-dim);
        transform: translateY(-3px);
        box-shadow: 0 16px 34px -22px rgba(0, 0, 0, 0.6);
      }
      .perfil-card-mini .mini-avatar {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        color: #0b0f0c;
        font-family: var(--display);
        font-size: 17px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.5);
      }
      .perfil-card-mini .mini-info {
        flex: 1;
        min-width: 0;
      }
      .perfil-card-mini .mini-nome {
        color: var(--text);
        font-family: var(--display);
        font-size: 14px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .perfil-card-mini .mini-seguidores {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }
      .perfil-card-mini .mini-seguidores strong {
        color: var(--amber);
        font-weight: 600;
      }
      .seguir-btn {
        font-family: var(--body-font);
        font-weight: 600;
        font-size: 12px;
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid rgba(61, 220, 132, 0.3);
        background: rgba(61, 220, 132, 0.1);
        color: var(--green);
        flex-shrink: 0;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .seguir-btn:hover {
        background: rgba(61, 220, 132, 0.18);
        transform: translateY(-1px);
      }
      .seguir-btn:active {
        transform: translateY(0);
      }
      .seguir-btn.seguindo {
        background: var(--surface-2);
        color: var(--text-muted);
        border-color: var(--border);
      }
      .seguir-btn.seguindo:hover {
        background: rgba(255, 107, 107, 0.08);
        color: var(--red);
        border-color: rgba(255, 107, 107, 0.25);
      }
      .seguir-btn.voce-mesmo {
        background: var(--surface-2);
        color: var(--text-faint);
        border-color: var(--border);
        cursor: default;
      }
      .seguir-btn.voce-mesmo:hover {
        background: var(--surface-2);
      }

      /* ===== Listagem de sites ===== */
      .home {
        padding: 6px 20px 40px;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }
      .home h3 {
        padding: 18px 2px 14px;
        font-size: 18px;
        font-family: var(--display);
        font-weight: 600;
        border-bottom: 1px solid var(--border-soft);
        color: var(--text);
      }
      .sites {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
        padding: 16px 0;
      }
      .product-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
        animation: rise 0.35s ease both;
        position: relative;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .product-card:hover {
        border-color: var(--green-dim);
        transform: translateY(-3px);
        box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.65);
      }
      .card-chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
      }
      .card-dots {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }
      .card-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .card-dots span:nth-child(1) {
        background: var(--red);
      }
      .card-dots span:nth-child(2) {
        background: var(--amber);
      }
      .card-dots span:nth-child(3) {
        background: var(--green);
      }
      .card-urlbar {
        flex: 1;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        background: var(--bg);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 4px 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-body {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .product-card h2 {
        color: var(--text);
        font-family: var(--display);
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-favicon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--green), var(--green-dim));
        color: #06110b;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-family: var(--display);
        box-shadow: 0 3px 10px -3px rgba(61, 220, 132, 0.5);
      }
      .product-card a {
        color: var(--green);
        text-decoration: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        word-break: break-all;
      }
      .product-card a:hover {
        text-decoration: underline;
      }
      .product-card p {
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--text-muted);
      }
      .card-meta {
        font-size: 11px;
        color: var(--text-faint);
        font-family: var(--mono);
        margin-top: 2px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card-views {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--amber);
      }
      .card-actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .like-btn,
      .dislike-btn {
        font-family: var(--body-font);
        font-weight: 600;
        font-size: 12.5px;
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.15s ease;
      }
      .like-btn {
        background: rgba(61, 220, 132, 0.1);
        color: var(--green);
        border-color: rgba(61, 220, 132, 0.25);
      }
      .like-btn:hover {
        background: rgba(61, 220, 132, 0.18);
        transform: translateY(-1px);
      }
      .dislike-btn {
        background: rgba(255, 107, 107, 0.08);
        color: var(--red);
        border-color: rgba(255, 107, 107, 0.2);
      }
      .dislike-btn:hover {
        background: rgba(255, 107, 107, 0.16);
        transform: translateY(-1px);
      }
      .delete-site-btn {
        font-family: var(--body-font);
        font-weight: 600;
        font-size: 12.5px;
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        color: var(--red);
        background: rgba(255, 107, 107, 0.08);
        border: 1px solid rgba(255, 107, 107, 0.2);
        transition: all 0.15s ease;
      }
      .delete-site-btn:hover {
        background: rgba(255, 107, 107, 0.16);
        transform: translateY(-1px);
      }
      .comments-btn {
        font-family: var(--body-font);
        font-weight: 600;
        font-size: 12.5px;
        border-radius: 8px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-muted);
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .comments-btn:hover {
        color: var(--text);
        border-color: var(--green-dim);
      }

      /* ===== Comments panel (inside card) ===== */
      .comments-panel {
        margin-top: 12px;
        border-top: 1px solid var(--border-soft);
        padding-top: 12px;
      }
      .comments-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 12px;
        max-height: 260px;
        overflow-y: auto;
      }
      .comment-item {
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .comment-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        gap: 8px;
      }
      .comment-author {
        font-family: var(--display);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
      }
      .comment-date {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--text-faint);
        flex-shrink: 0;
      }
      .comment-text {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .comment-reply {
        margin-top: 8px;
        padding: 8px 10px;
        background: rgba(61, 220, 132, 0.06);
        border-left: 2px solid var(--green-dim);
        border-radius: 6px;
      }
      .comment-reply-header {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--green);
        margin-bottom: 3px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .comment-reply p {
        font-size: 12.5px;
        color: var(--text-muted);
      }
      .comment-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .comment-form textarea {
        width: 100%;
        min-height: 60px;
        resize: vertical;
        padding: 10px 12px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: var(--body-font);
        font-size: 13px;
      }
      .comment-form textarea:focus {
        border-color: var(--green-dim);
      }
      .comment-form button {
        align-self: flex-end;
        padding: 7px 16px;
        background: var(--green);
        color: #06110b;
        border: none;
        border-radius: 7px;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        transition: filter 0.15s ease;
      }
      .comment-form button:hover {
        filter: brightness(1.08);
      }

      .empty-state {
        grid-column: 1/-1;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 13px;
        padding: 30px 15px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }

      /* ===== "precisa logado" gate ===== */
      .gate {
        max-width: 420px;
        margin: 60px auto;
        padding: 28px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .gate h2 {
        font-family: var(--display);
        color: var(--text);
        font-size: 19px;
        margin-bottom: 8px;
      }
      .gate p {
        color: var(--text-muted);
        font-size: 13.5px;
      }

      /* ===== Criar site (profissional) ===== */
      .criar-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 30px 20px 40px;
        width: 100%;
      }
      .criar-head {
        margin-bottom: 22px;
      }
      .criar-head .eyebrow {
        display: inline-block;
        font-size: 11px;
        font-family: var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 8px;
      }
      .criar-head h2 {
        font-family: var(--display);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .criar-head p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
        margin-top: 6px;
        max-width: 620px;
      }
      .criar-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      .criar-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
      }
      .form-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .form-section + .form-section {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-soft);
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--display);
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .section-title .step {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: rgba(61, 220, 132, 0.12);
        color: var(--green);
        font-family: var(--mono);
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .cf {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }
      .cf > label {
        font-size: 12px;
        font-family: var(--mono);
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cf > label .opt {
        text-transform: none;
        letter-spacing: 0;
        color: var(--text-faint);
        font-size: 11px;
      }
      .cf > label .req {
        color: var(--green);
        text-transform: none;
        letter-spacing: 0;
        font-size: 11px;
      }
      .criar-card input[type="text"],
      .criar-card textarea,
      .criar-card select {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-family: var(--body-font);
        font-size: 14px;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .criar-card input:focus,
      .criar-card textarea:focus,
      .criar-card select:focus {
        border-color: var(--green-dim);
        box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.08);
      }
      .criar-card ::placeholder {
        color: var(--text-faint);
      }
      .criar-card textarea {
        min-height: 96px;
        resize: vertical;
        line-height: 1.5;
      }
      .criar-card select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text-faint) 50%),
          linear-gradient(135deg, var(--text-faint) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) calc(50% - 2px),
          calc(100% - 12px) calc(50% - 2px);
        background-size: 6px 6px;
        background-repeat: no-repeat;
      }
      .cf.invalid input,
      .cf.invalid textarea,
      .cf.invalid select {
        border-color: var(--red);
      }
      .cf .hint {
        font-size: 12px;
        color: var(--text-faint);
        line-height: 1.5;
      }
      .cf .erro {
        font-size: 12px;
        color: var(--red);
        font-family: var(--mono);
        display: none;
      }
      .cf.invalid .erro {
        display: block;
      }
      .cf .counter {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        text-align: right;
      }
      .url-input {
        display: flex;
        align-items: stretch;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .url-input:focus-within {
        border-color: var(--green-dim);
        box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.08);
      }
      .cf.invalid .url-input {
        border-color: var(--red);
      }
      .url-input span {
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-faint);
        background: var(--surface-2);
        border-right: 1px solid var(--border);
      }
      .criar-card .url-input input {
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }
      .tags-box {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .tags-box:focus-within {
        border-color: var(--green-dim);
        box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.08);
      }
      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px 4px 10px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11.5px;
        background: rgba(61, 220, 132, 0.1);
        color: var(--green);
        border: 1px solid rgba(61, 220, 132, 0.25);
      }
      .tag-chip button {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0;
      }
      .criar-card .tags-box input {
        flex: 1;
        min-width: 110px;
        border: none;
        box-shadow: none;
        background: transparent;
        padding: 5px 4px;
      }
      .criar-actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
        align-items: center;
      }
      .btn-publicar {
        flex: 1;
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        background: linear-gradient(135deg, var(--green), #68e7a3);
        color: #06110b;
        border: none;
        font-weight: 700;
        font-family: var(--body-font);
        transition:
          filter 0.15s ease,
          transform 0.15s ease;
      }
      .btn-publicar:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }
      .btn-secundario {
        padding: 13px 16px;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
        background: var(--surface-2);
        color: var(--text-muted);
        border: 1px solid var(--border);
        font-family: var(--body-font);
        font-weight: 600;
        transition: all 0.15s ease;
      }
      .btn-secundario:hover {
        color: var(--red);
        border-color: rgba(255, 107, 107, 0.35);
      }
      .draft-note {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .criar-side {
        position: sticky;
        top: 86px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .side-label {
        font-family: var(--mono);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-faint);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .preview-box .product-card:hover {
        transform: none;
      }
      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 4px;
      }
      .card-tags span {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--text-muted);
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .card-tags .cat {
        color: var(--green);
        border-color: rgba(61, 220, 132, 0.25);
        background: rgba(61, 220, 132, 0.08);
      }
      .dicas-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
      }
      .dicas-card ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .dicas-card li {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
        display: flex;
        gap: 9px;
      }
      .dicas-card li i {
        color: var(--green);
        margin-top: 2px;
      }
      @media (max-width: 860px) {
        .criar-grid {
          grid-template-columns: 1fr;
        }
        .criar-side {
          position: static;
        }
      }
      @media (max-width: 560px) {
        .field-row {
          grid-template-columns: 1fr;
        }
        .criar-head h2 {
          font-size: 23px;
        }
        .criar-card {
          padding: 18px;
        }
      }

      /* ===== Result preview ===== */
      .resultado {
        max-width: 480px;
        margin: 30px auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        padding: 20px;
      }
      .resultado h2 {
        color: var(--text);
        font-family: var(--display);
        margin-bottom: 8px;
      }
      .resultado a {
        color: var(--green);
        font-family: var(--mono);
        font-size: 13px;
      }

      /* ===== Auth (login / cadastro) ===== */
      .auth-wrap {
        max-width: 400px;
        margin: 40px auto;
        padding: 0 16px;
        color: var(--text);
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px;
      }
      .auth-card h2 {
        font-family: var(--display);
        font-size: 21px;
        font-weight: 600;
      }
      .auth-sub {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .field {
        margin-top: 18px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-family: var(--mono);
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: var(--body-font);
      }
      .field input:focus {
        border-color: var(--green-dim);
      }
      .btn-primary {
        width: 100%;
        padding: 11px;
        background: var(--green);
        color: #06110b;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
        margin-top: 20px;
        font-family: var(--body-font);
        transition: filter 0.15s ease;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }
      .auth-msg {
        margin-top: 14px;
        font-size: 13px;
        font-family: var(--mono);
        min-height: 16px;
      }
      .auth-divider {
        margin: 22px 0;
        border: none;
        border-top: 1px solid var(--border-soft);
      }
      .auth-switch {
        color: var(--text-muted);
        font-size: 13px;
      }
      .auth-switch a {
        color: var(--green);
        text-decoration: none;
        cursor: pointer;
        font-weight: 600;
      }
      .auth-switch a:hover {
        text-decoration: underline;
      }

      /* password strength */
      .pw-strength {
        height: 5px;
        border-radius: 4px;
        margin-top: 8px;
        margin-bottom: 2px;
        background: var(--border);
        overflow: hidden;
      }
      .pw-strength-bar {
        height: 100%;
        width: 0%;
        background: var(--red);
        transition:
          width 0.3s,
          background 0.3s;
      }

      /* ===== Search ===== */
      .procurar {
        display: flex;
        justify-content: center;
        margin-top: 26px;
        padding: 0 16px;
        align-items: center;
      }
      .procurar input {
        padding: 12px 18px;
        border-radius: 999px;
        width: 100%;
        max-width: 480px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-family: var(--body-font);
        font-size: 14px;
      }
      .procurar input:focus {
        border-color: var(--green-dim);
      }
      .procurar ::placeholder {
        font-size: 14px;
        color: var(--text-faint);
      }

      /* ===== Perfil ===== */
      .perfil-wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 6px 20px 40px;
        width: 100%;
      }
      .perfil-header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 24px 0 18px;
      }
      .perfil-avatar {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        color: #0b0f0c;
        font-family: var(--display);
        font-size: 22px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.55);
      }
      .perfil-header h3 {
        font-family: var(--display);
        font-size: 19px;
        font-weight: 600;
        color: var(--text);
      }
      .perfil-header p {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-faint);
        margin-top: 3px;
      }
      .perfil-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        padding-bottom: 22px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .stat-card .stat-num {
        font-family: var(--display);
        font-size: 24px;
        font-weight: 700;
        color: var(--green);
      }
      .stat-card .stat-label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 4px;
      }
      .perfil-wrap h4 {
        font-family: var(--display);
        font-size: 16px;
        font-weight: 600;
        padding: 4px 2px 14px;
        border-bottom: 1px solid var(--border-soft);
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ranking-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 0 0;
      }
      .ranking-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        transition: border-color 0.2s ease;
      }
      .ranking-item:hover {
        border-color: var(--green-dim);
      }
      .ranking-pos {
        font-family: var(--display);
        font-size: 15px;
        font-weight: 700;
        color: var(--text-faint);
        width: 24px;
        flex-shrink: 0;
        text-align: center;
      }
      .ranking-pos.top1 {
        color: var(--green);
      }
      .ranking-info {
        flex: 1;
        min-width: 0;
      }
      .ranking-info .r-nome {
        color: var(--text);
        font-family: var(--display);
        font-size: 14px;
        font-weight: 600;
      }
      .ranking-info .r-url {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 11.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: block;
      }
      .ranking-views {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--amber);
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      /* ===== Perfil - Comentários ===== */
      .perfil-comments-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px 0 0;
      }
      .perfil-comment-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      .perfil-comment-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 6px;
      }
      .pc-site {
        font-family: var(--display);
        font-size: 13px;
        font-weight: 600;
        color: var(--green);
      }
      .pc-author {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .pc-date {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        margin-left: auto;
      }
      .perfil-comment-text {
        font-size: 13.5px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .reply-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--green);
        margin-bottom: 8px;
      }
      .reply-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .reply-form textarea {
        width: 100%;
        min-height: 56px;
        resize: vertical;
        padding: 10px 12px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-family: var(--body-font);
        font-size: 13px;
      }
      .reply-form textarea:focus {
        border-color: var(--green-dim);
      }
      .reply-form button {
        align-self: flex-end;
        padding: 7px 16px;
        background: rgba(61, 220, 132, 0.12);
        color: var(--green);
        border: 1px solid rgba(61, 220, 132, 0.3);
        border-radius: 7px;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
      }
      .reply-form button:hover {
        background: rgba(61, 220, 132, 0.2);
      }

      /* ===== Perfil detalhado ===== */
      .perfil-header {
        flex-wrap: wrap;
      }
      .perfil-header .perfil-avatar {
        width: 72px;
        height: 72px;
        font-size: 30px;
        border-radius: 18px;
      }
      .perfil-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .perfil-badge {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-muted);
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 3px 10px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .perfil-badge.destaque {
        color: var(--green);
        border-color: rgba(61, 220, 132, 0.25);
        background: rgba(61, 220, 132, 0.08);
      }
      .perfil-section {
        margin-top: 30px;
      }
      .perfil-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 30px;
      }
      .perfil-cols h4 {
        margin-bottom: 0;
      }
      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 16px;
      }
      .chip-user {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-family: var(--display);
        font-size: 12.5px;
        color: var(--text);
      }
      .chip-user .chip-av {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #0b0f0c;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-muted);
      }
      .bar-row .bar-label {
        width: 130px;
        flex-shrink: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-row .bar-track {
        flex: 1;
        height: 8px;
        background: var(--border-soft);
        border-radius: 6px;
        overflow: hidden;
      }
      .bar-row .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--green-dim), var(--green));
        border-radius: 6px;
      }
      .bar-row .bar-num {
        width: 28px;
        text-align: right;
        color: var(--amber);
      }
      .ranking-likes {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--green);
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .ranking-sub {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
        display: block;
      }
      @media (max-width: 700px) {
        .perfil-cols {
          grid-template-columns: 1fr;
        }
        .bar-row .bar-label {
          width: 90px;
        }
      }

      /* ===== Sync badge ===== */
      .sync-badge {
        font-family: var(--mono);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-faint);
      }
      .sync-badge.on {
        color: var(--green);
        border-color: rgba(61, 220, 132, 0.3);
        background: rgba(61, 220, 132, 0.08);
      }
      .sync-badge.off {
        color: var(--amber);
        border-color: rgba(255, 180, 84, 0.3);
        background: rgba(255, 180, 84, 0.08);
      }
      .sync-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      /* ===== Footer ===== */
      footer {
        margin-top: 40px;
        padding: 18px 20px;
        border-top: 1px solid var(--border-soft);
        color: var(--text-faint);
        font-size: 12.5px;
        font-family: var(--mono);
        z-index: 1000;
        background: var(--bg);
        text-align: center;
      }

      /* ===== Notificações (toast) ===== */
      #toast-container {
        position: fixed;
        top: 76px;
        right: 18px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(360px, calc(100vw - 36px));
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--green);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 13px;
        line-height: 1.45;
        box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
        animation: toastIn 0.28s ease both;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .toast i {
        font-size: 16px;
        line-height: 1.2;
        flex-shrink: 0;
      }
      .toast .toast-msg {
        flex: 1;
        word-break: break-word;
      }
      .toast .toast-msg code {
        font-family: var(--mono);
        color: var(--green);
        user-select: all;
      }
      .toast.success {
        border-left-color: var(--green);
        color: var(--text);
      }
      .toast.success i {
        color: var(--green);
      }
      .toast.error {
        border-left-color: var(--red);
      }
      .toast.error i {
        color: var(--red);
      }
      .toast.warning {
        border-left-color: var(--amber);
      }
      .toast.warning i {
        color: var(--amber);
      }
      .toast.info {
        border-left-color: #5aa9ff;
      }
      .toast.info i {
        color: #5aa9ff;
      }
      .toast::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: var(--toast-color, var(--green));
        opacity: 0.45;
        transform-origin: left;
        animation: toastBar var(--dur, 4000ms) linear forwards;
      }
      .toast.success {
        --toast-color: var(--green);
      }
      .toast.error {
        --toast-color: var(--red);
      }
      .toast.warning {
        --toast-color: var(--amber);
      }
      .toast.info {
        --toast-color: #5aa9ff;
      }
      .toast.saindo {
        animation: toastOut 0.25s ease forwards;
      }
      .toast.confirm {
        border-left-color: var(--amber);
        cursor: default;
      }
      .toast.confirm i {
        color: var(--amber);
      }
      .toast.confirm::after {
        display: none;
      }
      .toast-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .toast-actions button {
        font-family: var(--body-font);
        font-weight: 600;
        font-size: 12.5px;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--border);
        transition: all 0.15s ease;
      }
      .toast-actions .toast-ok {
        background: var(--green);
        color: #06110b;
        border-color: var(--green);
      }
      .toast-actions .toast-ok:hover {
        filter: brightness(1.08);
      }
      .toast-actions .toast-cancel {
        background: var(--surface-2);
        color: var(--text-muted);
      }
      .toast-actions .toast-cancel:hover {
        color: var(--red);
        border-color: rgba(255, 107, 107, 0.35);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes toastOut {
        to {
          opacity: 0;
          transform: translateX(24px);
        }
      }
      @keyframes toastBar {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

    <script>
      const localHosts = ["localhost", "127.0.0.1", "::1", ""];
      const configuredApiUrl =
        window.NEXSITES_API_URL ||

        (localHosts.includes(window.location.hostname)
          ? `${window.location.protocol === "https:" ? "https:" : "http:"}//127.0.0.1:8000`
          : "");
      const apiUrl = (path) => API_BASE + path;
      const tela = document.getElementById("tela");
      const criar = document.getElementById("criar");
      const meusites = document.getElementById("meusites");
      const procuraBtn = document.getElementById("procurar");
      const loginBtn = document.getElementById("loginBtn");
      const cadastroBtn = document.getElementById("cadastro");
      const perfilBtn = document.getElementById("perfilBtn");
      const comentariosBtn = document.getElementById("comentariosBtn");
      const cata = document.getElementById("cata");

    
      function prepararCloneFooter() {
        const footerMenu = document.getElementById("footer-menu");
        if (!footerMenu || !cata) return;
        footerMenu.innerHTML = "";
        Array.from(cata.children).forEach((el) => {
          const clone = el.cloneNode(true);
          if (el.id) clone.dataset.origId = el.id;
          if (el.classList.contains("hidden")) clone.classList.add("hidden");
          clone.removeAttribute("id");
          clone.addEventListener("click", (e) => {
            e.preventDefault();
            const original = document.getElementById(clone.dataset.origId);
            if (original) original.click();
          });
          footerMenu.appendChild(clone);
        });
      }

      let historico = JSON.parse(localStorage.getItem("nex_historico") || "[]");
      let usuarios = JSON.parse(localStorage.getItem("nex_usuarios") || "[]");
      let comentarios = JSON.parse(
        localStorage.getItem("nex_comentarios") || "[]",
      );
      let seguidoresList = JSON.parse(
        localStorage.getItem("nex_seguidores") || "[]",
      );
      let token = localStorage.getItem("nex_token") || null;
      let username = localStorage.getItem("nex_user") || null;
      let hasServer = false;
      let usuariosServer = []; // nomes de todas as pessoas cadastradas no servidor

      /* =========================================================
   NOTIFICAÇÕES (substitui alert)
   notificar(mensagemHTML, tipo, duracaoMs)
   tipos: 'success' | 'error' | 'warning' | 'info'
   ========================================================= */
      function notificar(msg, tipo = "info", duracao = 4000) {
        let box = document.getElementById("toast-container");
        if (!box) {
          box = document.createElement("div");
          box.id = "toast-container";
          document.body.appendChild(box);
        }
        const icones = {
          success: "bi-check-circle-fill",
          error: "bi-x-circle-fill",
          warning: "bi-exclamation-triangle-fill",
          info: "bi-info-circle-fill",
        };
        const toast = document.createElement("div");
        toast.className = "toast " + tipo;
        toast.style.setProperty("--dur", duracao + "ms");
        toast.innerHTML = `<i class="bi ${icones[tipo] || icones.info}"></i><div class="toast-msg">${msg}</div>`;

        const fechar = () => {
          if (toast.classList.contains("saindo")) return;
          toast.classList.add("saindo");
          setTimeout(() => toast.remove(), 250);
        };
        toast.addEventListener("click", fechar);
        box.appendChild(toast);
        setTimeout(fechar, duracao);
      }

      // Notificação de confirmação: retorna Promise<boolean> (true = confirmou)
      function confirmarNotificacao(
        msg,
        textoOk = "Confirmar",
        textoCancelar = "Cancelar",
      ) {
        return new Promise((resolve) => {
          let box = document.getElementById("toast-container");
          if (!box) {
            box = document.createElement("div");
            box.id = "toast-container";
            document.body.appendChild(box);
          }
          const toast = document.createElement("div");
          toast.className = "toast confirm";
          toast.innerHTML = `
            <i class="bi bi-question-circle-fill"></i>
            <div class="toast-msg">
                ${msg}
                <div class="toast-actions">
                    <button type="button" class="toast-ok">${textoOk}</button>
                    <button type="button" class="toast-cancel">${textoCancelar}</button>
                </div>
            </div>`;
          const fechar = (resultado) => {
            if (toast.classList.contains("saindo")) return;
            toast.classList.add("saindo");
            setTimeout(() => toast.remove(), 250);
            resolve(resultado);
          };
          toast
            .querySelector(".toast-ok")
            .addEventListener("click", () => fechar(true));
          toast
            .querySelector(".toast-cancel")
            .addEventListener("click", () => fechar(false));
          box.appendChild(toast);
          toast.querySelector(".toast-ok").focus();
        });
      }

      const CLOUD_BIN_ID = ""; 
      const CLOUD_API = "https://api.jsonstorage.net/v1/json";
      let cloudReady = false;
      let cloudSyncTimer = null;
      let cloudStatusMsg = "Ainda não verificado.";

      async function cloudGetSites() {
        const res = await fetch(`${CLOUD_API}/${CLOUD_BIN_ID}`);
        if (!res.ok) throw new Error("cloud fetch failed");
        return await res.json();
      }

      async function cloudSaveSites(sites) {
        if (!CLOUD_BIN_ID) return;
        await fetch(`${CLOUD_API}/${CLOUD_BIN_ID}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sites,
            comentarios,
            seguidores: seguidoresList,
          }),
        });
      }

      // Junta os comentarios vindos do armazenamento compartilhado com os locais,
      // para que cada pessoa veja o que TODO mundo comentou (com o autor de cada um).
      // Também sincroniza quem segue quem: a nuvem manda nos follows dos outros,
      // e este navegador manda nos follows de quem está logado (assim "deixar de seguir" funciona).
      function applyCloudComments(data) {
        if (data && Array.isArray(data.seguidores)) {
          const meu = (username || "").toLowerCase();
          const dosOutros = data.seguidores.filter(
            (s) => (s.seguidor || "").toLowerCase() !== meu,
          );
          const meus = seguidoresList.filter(
            (s) => (s.seguidor || "").toLowerCase() === meu,
          );
          seguidoresList = dosOutros.concat(meus);
          localStorage.setItem(
            "nex_seguidores",
            JSON.stringify(seguidoresList),
          );
        }
        if (!data || !Array.isArray(data.comentarios)) return;
        const porId = new Map();
        comentarios.forEach((c) => porId.set(String(c.id), c));
        data.comentarios.forEach((c) => porId.set(String(c.id), c));
        comentarios = Array.from(porId.values());
        localStorage.setItem("nex_comentarios", JSON.stringify(comentarios));
      }

      async function loadServerComments() {
        const res = await fetch(apiUrl("/api/comments"));
        if (!res.ok) throw new Error("Não foi possível carregar os comentários.");
        const serverComments = await res.json();
        const byId = new Map();
        comentarios.forEach((comment) => byId.set(String(comment.id), comment));
        serverComments.forEach((comment) =>
          byId.set(String(comment.id), comment),
        );
        comentarios = Array.from(byId.values());
        localStorage.setItem("nex_comentarios", JSON.stringify(comentarios));
      }

      // Puxa do servidor Python TUDO que as pessoas postaram:
      // sites, comentários (com respostas), usuários cadastrados e quem segue quem.
      async function syncFromServer() {
        const [sitesRes, comRes, usersRes, followsRes] = await Promise.all([
          fetch(apiUrl("/api/sites")),
          fetch(apiUrl("/api/comments")),
          fetch(apiUrl("/api/users")),
          fetch(apiUrl("/api/follows")),
        ]);
        if (sitesRes.ok) {
          historico = await sitesRes.json();
          localStorage.setItem("nex_historico", JSON.stringify(historico));
        }
        if (comRes.ok) {
          comentarios = await comRes.json();
          localStorage.setItem("nex_comentarios", JSON.stringify(comentarios));
        }
        if (usersRes.ok) {
          usuariosServer = await usersRes.json();
        }
        if (followsRes.ok) {
          seguidoresList = await followsRes.json();
          localStorage.setItem(
            "nex_seguidores",
            JSON.stringify(seguidoresList),
          );
        }
      }

      function scheduleCloudSync() {
        if (!cloudReady) return;
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
          cloudSaveSites(historico).catch(() => {
            console.warn(
              "Não foi possível sincronizar com o armazenamento compartilhado agora.",
            );
          });
        }, 900);
      }

      function mostrarAvisoBin(novoId) {
        console.log(
          "%c[NexSites] Bin compartilhado criado! Copie este ID para CLOUD_BIN_ID no código:\n" +
            novoId,
          "color:#3ddc84;font-weight:bold;font-size:13px;",
        );
        notificar(
          "Armazenamento compartilhado criado!<br>Cole este ID em <b>CLOUD_BIN_ID</b> no topo do &lt;script&gt; e salve o arquivo:<br><code>" +
            escapeHTML(novoId) +
            "</code><br><small>(também impresso no console - F12)</small>",
          "success",
          30000,
        );
      }

      async function initCloudSync() {
        if (CLOUD_BIN_ID) {
          cloudStatusMsg = "Conectando ao armazenamento compartilhado...";
          atualizarSyncBadge();
          try {
            const data = await cloudGetSites();
            applyCloudComments(data);
            if (data && Array.isArray(data.sites)) {
              historico = data.sites;
              normalizeSiteIds(historico);
              localStorage.setItem("nex_historico", JSON.stringify(historico));
            }
            cloudReady = true;
            cloudStatusMsg =
              "Conectado! Os sites publicados por qualquer pessoa aparecem aqui.";
          } catch (e) {
            cloudReady = false;
            cloudStatusMsg =
              "Falha ao conectar no bin compartilhado (ID: " +
              CLOUD_BIN_ID +
              ").\nErro: " +
              (e && e.message ? e.message : e) +
              '\n\nPossíveis causas: sem internet, ID errado/apagado, ou bloqueio de CORS ao abrir o arquivo direto do disco (tente rodar via um servidor local, ex: "python -m http.server", em vez de dar duplo-clique no arquivo).';
            console.warn("[NexSites] " + cloudStatusMsg, e);
          }
        } else {
          cloudStatusMsg =
            "Criando armazenamento compartilhado pela primeira vez...";
          atualizarSyncBadge();
          try {
            const res = await fetch(CLOUD_API, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sites: historico }),
            });
            if (!res.ok)
              throw new Error("HTTP " + res.status + " ao criar o bin");
            const data = await res.json();
            const match = data.uri && data.uri.match(/\/v1\/json\/(.+)$/);
            const novoId = match ? match[1] : null;
            if (novoId) {
              cloudStatusMsg =
                "Bin criado! Copie este ID para a constante CLOUD_BIN_ID no código e salve o arquivo:\n\n" +
                novoId;
              mostrarAvisoBin(novoId);
            } else {
              cloudStatusMsg =
                "O bin foi criado mas a resposta veio num formato inesperado: " +
                JSON.stringify(data);
            }
          } catch (e) {
            cloudStatusMsg =
              "Não foi possível criar o armazenamento compartilhado.\nErro: " +
              (e && e.message ? e.message : e) +
              "\n\nIsso costuma acontecer quando o arquivo é aberto direto do disco (file://) e o navegador bloqueia a requisição por CORS. " +
              'Tente: 1) rodar um servidor local (ex: "python -m http.server" na pasta do arquivo e abrir http://localhost:8000/nexsites.html), ' +
              "ou 2) hospedar o arquivo em algo como Netlify/GitHub Pages, ou 3) abrir o Console (F12) e ver o erro exato de rede.";
            console.warn("[NexSites] " + cloudStatusMsg, e);
          }
          cloudReady = false;
        }
      }

      function atualizarSyncBadge() {
        // Badge removido da interface; mantemos a função como no-op para evitar
        // referências quebradas em rotinas de sincronização que ainda chamam esta API.
      }

      document.addEventListener("DOMContentLoaded", () => {
        const badge = document.getElementById("syncBadge");
        if (badge) {
          badge.addEventListener("click", async () => {
            if (cloudReady) {
              notificar(escapeHTML("Status: " + cloudStatusMsg), "info", 6000);
              return;
            }
            const querTentar = confirm(
              (cloudStatusMsg || "Ainda não verificado.") +
                "\n\nDeseja tentar conectar/criar o armazenamento compartilhado agora?",
            );
            if (querTentar) {
              badge.innerHTML = '<span class="dot"></span> tentando...';
              await initCloudSync();
            }
          });
        }
      });

      const HUB_ID = "nexsites-hub-v1";
      let peer = null;
      let isHub = false;
      let hubConn = null;
      let clientConns = {};
      let onlineUsers = {};
      let reconnectTimer = null;
      let currentView = "inicial";

      function broadcastToClients(msg, exceptPeerId) {
        Object.keys(clientConns).forEach((pid) => {
          if (pid === exceptPeerId) return;
          const conn = clientConns[pid];
          if (conn && conn.open) {
            try {
              conn.send(msg);
            } catch (e) {}
          }
        });
      }

      function broadcastRealtime(msg) {
        if (isHub) {
          broadcastToClients(msg);
        } else if (hubConn && hubConn.open) {
          try {
            hubConn.send(msg);
          } catch (e) {}
        }
      }

      function mergeSiteIntoHistorico(site) {
        if (!site || !site.id) return;
        const idx = historico.findIndex(
          (s) => String(s.id) === String(site.id),
        );
        if (idx !== -1) historico[idx] = site;
        else historico.unshift(site);
        localStorage.setItem("nex_historico", JSON.stringify(historico));
        scheduleCloudSync();
        refreshCurrentSitesView();
        renderPerfis();
      }

      function mergeManySitesIntoHistorico(sites) {
        // usado quando chega uma sincronização completa (full_sync) de outra pessoa,
        // por exemplo logo depois de logar e conectar no hub em tempo real
        if (!Array.isArray(sites) || sites.length === 0) return;
        const mapa = {};
        historico.forEach((s) => {
          if (s && s.id != null) mapa[String(s.id)] = s;
        });
        sites.forEach((s) => {
          if (s && s.id != null) mapa[String(s.id)] = s;
        });
        historico = Object.values(mapa).sort(
          (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
        );
        localStorage.setItem("nex_historico", JSON.stringify(historico));
        scheduleCloudSync();
        refreshCurrentSitesView();
        renderPerfis();
      }

      function refreshCurrentSitesView() {
        if (currentView === "home" && homeBtn) homeBtn.click();
        else if (currentView === "meusites" && meusites) meusites.click();
      }

      function atualizarOnlineBadge() {
        const badge = document.getElementById("onlineBadge");
        if (!badge) return;
        const nomes = Object.values(onlineUsers);
        const total = nomes.length;
        if (total > 0) {
          badge.style.display = "flex";
          badge.title = nomes.join(", ");
          badge.innerHTML =
            '<span class="dot"></span> ' + total + " online agora";
        } else {
          badge.style.display = "none";
        }
      }

      function broadcastPresence() {
        broadcastToClients({
          type: "presence_update",
          users: Object.assign({}, onlineUsers),
        });
        atualizarOnlineBadge();
      }

      function handleIncomingData(conn, data) {
        if (!data || !data.type) return;
        if (data.type === "login") {
          onlineUsers[conn.peer] = data.username;
          if (isHub) broadcastPresence();
        } else if (data.type === "presence_update") {
          onlineUsers = data.users || {};
          if (username && peer) onlineUsers[peer.id] = username;
          atualizarOnlineBadge();
        } else if (data.type === "novo_site" || data.type === "site_update") {
          mergeSiteIntoHistorico(data.site);
          if (isHub) broadcastToClients(data, conn.peer);
        } else if (data.type === "full_sync") {
          mergeManySitesIntoHistorico(data.sites);
          if (Array.isArray(data.seguidores)) {
            const meu = (username || "").toLowerCase();
            const dosOutros = data.seguidores.filter(
              (s) => (s.seguidor || "").toLowerCase() !== meu,
            );
            const meus = seguidoresList.filter(
              (s) => (s.seguidor || "").toLowerCase() === meu,
            );
            seguidoresList = dosOutros.concat(meus);
            localStorage.setItem(
              "nex_seguidores",
              JSON.stringify(seguidoresList),
            );
            atualizarBotoesSeguir();
            renderPerfis();
          }
        } else if (data.type === "seguir") {
          if (data.seguidor && data.seguido) {
            aplicarSeguir(data.seguidor, data.seguido, !!data.ativo);
            if (isHub) broadcastToClients(data, conn.peer);
            atualizarBotoesSeguir();
            renderPerfis();
          }
        }
      }

      function setupHub() {
        isHub = true;
        clientConns = {};
        peer.on("connection", (conn) => {
          clientConns[conn.peer] = conn;
          conn.on("open", () => {
            // assim que alguém conecta no hub, manda logo a lista completa
            // de sites já publicados e quem segue quem
            try {
              conn.send({
                type: "full_sync",
                sites: historico,
                seguidores: seguidoresList,
              });
            } catch (e) {}
          });
          conn.on("data", (data) => handleIncomingData(conn, data));
          conn.on("close", () => {
            delete clientConns[conn.peer];
            delete onlineUsers[conn.peer];
            broadcastPresence();
          });
        });
        if (username) {
          onlineUsers[peer.id] = username;
          atualizarOnlineBadge();
        }
      }

      function setupClient() {
        isHub = false;
        hubConn = peer.connect(HUB_ID, { reliable: true });
        hubConn.on("open", () => {
          if (username) hubConn.send({ type: "login", username });
        });
        hubConn.on("data", (data) => handleIncomingData(hubConn, data));
        hubConn.on("close", () => {
          atualizarOnlineBadge();
          agendarReconexao();
        });
        hubConn.on("error", () => {
          agendarReconexao();
        });
      }

      function agendarReconexao() {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (token && username) startRealtime();
        }, 4000);
      }

      function startRealtime() {
        if (!token || !username) return;
        if (peer && !peer.destroyed) return; // já conectado/conectando

        if (typeof Peer === "undefined") {
          console.warn(
            "[NexSites] PeerJS não carregou; recursos em tempo real desativados (sem internet ou CDN bloqueado).",
          );
          return;
        }

        try {
          peer = new Peer(HUB_ID);
        } catch (e) {
          console.warn("[NexSites] Não foi possível iniciar o tempo real.", e);
          return;
        }

        peer.on("open", () => {
          setupHub();
        });

        peer.on("error", (err) => {
          if (err && err.type === "unavailable-id") {
            // já existe alguém como hub, conecta como cliente
            try {
              peer.destroy();
            } catch (e) {}
            peer = new Peer();
            peer.on("open", () => setupClient());
            peer.on("error", () => agendarReconexao());
          } else {
            console.warn("[NexSites] Erro de conexão em tempo real:", err);
            agendarReconexao();
          }
        });
      }

      function stopRealtime() {
        clearTimeout(reconnectTimer);
        Object.values(clientConns).forEach((c) => {
          try {
            c.close();
          } catch (e) {}
        });
        clientConns = {};
        if (hubConn) {
          try {
            hubConn.close();
          } catch (e) {}
        }
        hubConn = null;
        if (peer) {
          try {
            peer.destroy();
          } catch (e) {}
        }
        peer = null;
        isHub = false;
        onlineUsers = {};
        atualizarOnlineBadge();
      }

      function normalizeSiteIds(sites) {
        if (!Array.isArray(sites)) return false;
        let changed = false;
        sites.forEach((site) => {
          if (!site) return;
          if (site.id == null || site.id === "undefined") {
            site.id =
              "local_" +
              Date.now() +
              "_" +
              Math.random().toString(36).slice(2, 8);
            changed = true;
          }
          if (typeof site.views !== "number") {
            site.views = 0;
            changed = true;
          }
        });
        return changed;
      }

      if (normalizeSiteIds(historico)) {
        saveLocal();

      function saveSeguidores() {
        localStorage.setItem("nex_seguidores", JSON.stringify(seguidoresList));

      function contarSeguidores(nomeUsuario) {
        return seguidoresList.filter(
          (s) => s.seguido.toLowerCase() === nomeUsuario.toLowerCase(),
        ).length;
      }

      function estaSeguindo(seguidor, seguido) {
        return seguidoresList.some(
          (s) =>
            s.seguidor.toLowerCase() === seguidor.toLowerCase() &&
            s.seguido.toLowerCase() === seguido.toLowerCase(),
        );
      }

      // aplica (ou remove) um vínculo seguidor -> seguido, sem duplicar
      function aplicarSeguir(seguidor, seguido, ativo) {
        seguidoresList = seguidoresList.filter(
          (s) =>
            !(
              s.seguidor.toLowerCase() === seguidor.toLowerCase() &&
              s.seguido.toLowerCase() === seguido.toLowerCase()
            ),
        );
        if (ativo) {
          seguidoresList.push({
            seguidor,
            seguido,
            createdAt: new Date().toISOString(),
          });
        }
        saveSeguidores();
      }

      // atualiza texto/estilo de todos os botões "Seguir" visíveis na tela
      function atualizarBotoesSeguir() {
        document.querySelectorAll("button[data-seguir]").forEach((btn) => {
          const alvo = btn.getAttribute("data-seguir");
          const seguindo = !!(token && username && estaSeguindo(username, alvo));
          btn.classList.toggle("seguindo", seguindo);
          if (btn.closest(".perfil-card-mini")) {
            btn.textContent = seguindo ? "Seguindo" : "Seguir";
          } else {
            btn.textContent = seguindo ? "Seguindo" : "Seguir " + alvo;
          }
        });
      }

      function toggleSeguir(nomeAlvo) {
        if (!token || !username) {
          notificar("Faça login para seguir outros perfis", "warning");
          return;
        }
        if (username.toLowerCase() === nomeAlvo.toLowerCase()) return;

        const ativo = !estaSeguindo(username, nomeAlvo);
        aplicarSeguir(username, nomeAlvo, ativo);
        if (hasServer) {
          fetch(apiUrl("/api/follows"), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify({ seguido: nomeAlvo, ativo }),
          }).catch(() => {});
        }
        broadcastRealtime({
          type: "seguir",
          seguidor: username,
          seguido: nomeAlvo,
          ativo,
        });
        atualizarBotoesSeguir();
        renderPerfis();
      }

      function hashSenha(senha) {
        let hash = 0;
        for (let i = 0; i < senha.length; i++) {
          hash = (hash * 31 + senha.charCodeAt(i)) >>> 0;
        }
        return hash.toString(16);
      }

      function gerarToken() {
        return (
          "tok_" +
          Date.now().toString(36) +
          "_" +
          Math.random().toString(36).slice(2, 10)
        );
      }

      function calcularForcaSenha(senha) {
        let score = 0;
        if (senha.length >= 6) score++;
        if (senha.length >= 10) score++;
        if (/[A-Z]/.test(senha)) score++;
        if (/[0-9]/.test(senha)) score++;
        if (/[^A-Za-z0-9]/.test(senha)) score++;
        return score; // 0 a 5
      }

      function atualizarBarraForca(senha) {
        const bar = document.getElementById("pwBar");
        if (!bar) return;
        const score = calcularForcaSenha(senha);
        const pct = (score / 5) * 100;
        bar.style.width = pct + "%";
        if (score <= 1) bar.style.background = "#ff6b6b";
        else if (score <= 3) bar.style.background = "#ffb454";
        else bar.style.background = "#3ddc84";
      }

      function escapeHTML(str) {
        if (str == null) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function corAvatar(nome) {
        const str = (nome || "?").toLowerCase();
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
        }
        const matiz = hash % 360;
        const matiz2 = (matiz + 38) % 360;
        return `linear-gradient(135deg, hsl(${matiz} 72% 58%), hsl(${matiz2} 62% 42%))`;
      }

      function getDomain(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch (e) {
          return url || "";
        }
      }
