      function attachCommentFormHandler(container, siteId) {
        const form = container.querySelector(".comment-form");
        if (!form) return;
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const textarea = form.querySelector("textarea");
          const texto = textarea.value.trim();
          if (!texto) return;
          if (!token || !username) {
            notificar("Faça login para comentar", "warning");
            return;
          }

          if (hasServer) {
            try {
              const res = await fetch(apiUrl(`/api/sites/${siteId}/comments`), {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token,
                },
                body: JSON.stringify({ texto }),
              });
              if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || "Não foi possível enviar o comentário.");
              }
              const savedComment = await res.json();
              comentarios = comentarios.filter(
                (comment) => String(comment.id) !== String(savedComment.id),
              );
              comentarios.push(savedComment);
              saveComentarios();
              container.innerHTML = renderComentariosPanelHTML(siteId);
              attachCommentFormHandler(container, siteId);
              updateCommentsBtnCount(siteId);
              return;
            } catch (err) {
              if (err instanceof TypeError) {
                hasServer = false;
              } else {
                notificar(escapeHTML(err.message), "error");
                return;
              }
            }
          }

          const novoComentario = {
            id:
              "com_" +
              Date.now() +
              "_" +
              Math.random().toString(36).slice(2, 8),
            siteId,
            author: username,
            texto,
            resposta: null,
            createdAt: new Date().toISOString(),
          };
          comentarios.push(novoComentario);
          saveComentarios();
          container.innerHTML = renderComentariosPanelHTML(siteId);
          attachCommentFormHandler(container, siteId);
          updateCommentsBtnCount(siteId);
        });
      }

      function attachCommentHandlers() {
        document.querySelectorAll(".comments-btn").forEach((btn) => {
          btn.removeEventListener("click", btn.toggleHandler);
          btn.toggleHandler = () => {
            const id = btn.getAttribute("data-id");
            const panel = document.getElementById("comments-panel-" + id);
            if (!panel) return;
            const isOpen = panel.dataset.open === "true";

            // Fecha os comentários de todos os outros sites antes de abrir/alternar este
            document.querySelectorAll(".comments-panel").forEach((p) => {
              if (p !== panel) {
                p.dataset.open = "false";
                p.style.display = "none";
              }
            });

            if (isOpen) {
              panel.dataset.open = "false";
              panel.style.display = "none";
              return;
            }
            panel.innerHTML = renderComentariosPanelHTML(id);
            panel.dataset.open = "true";
            panel.style.display = "block";
            attachCommentFormHandler(panel, id);
          };
          btn.addEventListener("click", btn.toggleHandler);
        });
      }

      function registrarVisualizacao(id) {
        if (hasServer) {
          fetch(apiUrl(`/api/sites/${id}/view`), { method: "POST" })
            .then((res) => res.json())
            .then((data) => {
              if (data && data.views != null) {
                const idx = historico.findIndex(
                  (s) =>
                    String(s.id) === String(id) || String(s.url) === String(id),
                );
                if (idx !== -1) {
                  historico[idx].views = data.views;
                  saveLocal();
                  broadcastRealtime({
                    type: "site_update",
                    site: historico[idx],
                  });
                }
              }
            })
            .catch(() => {
              hasServer = false;
            });
          return;
        }

        const idx = historico.findIndex(
          (s) => String(s.id) === String(id) || String(s.url) === String(id),
        );
        if (idx !== -1) {
          historico[idx].views = (historico[idx].views || 0) + 1;
          saveLocal();
          broadcastRealtime({ type: "site_update", site: historico[idx] });
        }
      }

      function attachLikeHandlers(callback) {
        attachCommentHandlers();
        attachSeguirHandlers();
        document.querySelectorAll(".site-link").forEach((link) => {
          link.removeEventListener("click", link.viewHandler);
          link.viewHandler = () => {
            const id = link.getAttribute("data-id");
            registrarVisualizacao(id);
          };
          link.addEventListener("click", link.viewHandler);
        });
        document.querySelectorAll(".like-btn").forEach((btn) => {
          btn.removeEventListener("click", btn.clickHandler);
          btn.clickHandler = async (e) => {
            const id = btn.getAttribute("data-id");
            if (!token) {
              notificar("Faça login para curtir sites", "warning");
              return;
            }
            if (hasServer) {
              try {
                const res = await fetch(apiUrl(`/api/sites/${id}/like`), {
                  method: "POST",
                  headers: { Authorization: "Bearer " + token },
                });
                if (!res.ok) {
                  const data = await res.json().catch(() => ({}));
                  notificar(escapeHTML(data.error || "Não foi possível curtir o site."), "error");
                  return;
                }
                if (callback) callback();
                return;
              } catch (err) {
                if (err instanceof TypeError) hasServer = false;
                else return;
              }
            }
            const idx = historico.findIndex(
              (s) =>
                String(s.id) === String(id) || String(s.url) === String(id),
            );
            if (idx !== -1) {
              historico[idx].likes = (historico[idx].likes || 0) + 1;
              saveLocal();
              broadcastRealtime({ type: "site_update", site: historico[idx] });
              if (callback) callback();
            }
          };
          btn.addEventListener("click", btn.clickHandler);
        });
        document.querySelectorAll(".dislike-btn").forEach((btn) => {
          btn.removeEventListener("click", btn.clickHandler);
          btn.clickHandler = async (e) => {
            const id = btn.getAttribute("data-id");
            if (!token) {
              notificar("Faça login para descurtir sites", "warning");
              return;
            }
            if (hasServer) {
              try {
                const res = await fetch(apiUrl(`/api/sites/${id}/dislike`), {
                  method: "POST",
                  headers: { Authorization: "Bearer " + token },
                });
                if (!res.ok) {
                  const data = await res.json().catch(() => ({}));
                  notificar(escapeHTML(data.error || "Não foi possível descurtir o site."), "error");
                  return;
                }
                if (callback) callback();
                return;
              } catch (err) {
                if (err instanceof TypeError) hasServer = false;
                else return;
              }
            }
            const idx = historico.findIndex(
              (s) =>
                String(s.id) === String(id) || String(s.url) === String(id),
            );
            if (idx !== -1) {
              historico[idx].dislikes = (historico[idx].dislikes || 0) + 1;
              saveLocal();
              broadcastRealtime({ type: "site_update", site: historico[idx] });
              if (callback) callback();
            }
          };
          btn.addEventListener("click", btn.clickHandler);
        });

      function removeSiteLocally(siteId, syncCloud = true) {
        historico = historico.filter((site) => String(site.id) !== String(siteId));
        comentarios = comentarios.filter(
          (comment) => String(comment.siteId) !== String(siteId),
        );
        localStorage.setItem("nex_historico", JSON.stringify(historico));

        document.querySelectorAll(".delete-site-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {

            const site = historico.find((item) => String(item.id) === String(id));

            const confirmou = await confirmarNotificacao(
              "Deseja excluir <b>" + escapeHTML(nomeSite) + "</b>? Essa ação não pode ser desfeita.",
              "Sim, excluir",

            if (!confirmou) return;

            if (hasServer) {

                const res = await fetch(apiUrl(`/api/sites/${encodeURIComponent(id)}`), {
                  method: "DELETE",
                  headers: { Authorization: "Bearer " + token },
                });
                if (!res.ok) {
                  const data = await res.json().catch(() => ({}));
                  notificar(

                notificar("Não foi possível conectar ao servidor para excluir o site.", "error");

            notificar("Site excluído com sucesso.", "success");

        const sitesContainer = document.getElementById("sites");

      async function loadAndShowSites() {
        if (hasServer) {
          try {
            // mostra TUDO que foi postado por todo mundo, mais recentes primeiro
            const res = await fetch(apiUrl("/api/sites"));
            if (!res.ok) throw new Error("api");
            const sites = await res.json();
            historico = sites;
            localStorage.setItem("nex_historico", JSON.stringify(historico));
            showSitesList(
              sites
                .slice()
                .sort(
                  (a, b) =>
                    new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
                ),
            );
            renderPerfis();
            return;
          } catch (e) {
            hasServer = false;
          }
        }

        // busca a versão mais recente do banco compartilhado antes de exibir,
        // assim sites publicados por outras pessoas aparecem aqui também
        if (cloudReady) {
          try {
            const data = await cloudGetSites();
            applyCloudComments(data);
            if (data && Array.isArray(data.sites)) {
              historico = data.sites;
              localStorage.setItem("nex_historico", JSON.stringify(historico));
            }
          } catch (e) {
            console.warn(
              "Não foi possível atualizar a lista compartilhada agora, mostrando dados locais.",
            );
          }
        }

        // fallback local
        // mostra TODOS os sites que já foram compartilhados por qualquer pessoa,
        // com os mais recentes primeiro (para não esconder publicações novas)
        const ordenados = historico
          .slice()
          .sort(
            (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
          );
        showSitesList(ordenados);
      }

        const form = document.getElementById("formulario");

          descri: el("descri"),
          detalhes: el("detalhes"),
          repo: el("repo"),
        };

        // restaura rascunho
        Object.keys(campos).forEach((k) => {
          if (rascunho[k]) campos[k].value = rascunho[k];
        });

        const normalizaUrl = (v) => {
          v = (v || "").trim().replace(/^https?:\/\//i, "");
          return v ? "https://" + v : "";
        };
        const urlValida = (v) => {
          try {
            const u = new URL(v);
            return (
              /^https?:$/.test(u.protocol) &&
              (/\.[a-z]{2,}$/i.test(u.hostname) || u.hostname === "localhost")
            );
          } catch (_) {
            return false;
          }
        };

        function renderTags() {
          const box = el("tagsBox");
          box.querySelectorAll(".tag-chip").forEach((c) => c.remove());
          const input = el("tagInput");
          tags.forEach((t, i) => {
            const chip = document.createElement("span");
            chip.className = "tag-chip";
            chip.innerHTML = `#${escapeHTML(t)} <button type="button" aria-label="Remover tag" data-i="${i}">×</button>`;
            box.insertBefore(chip, input);
          });
          input.style.display = tags.length >= 5 ? "none" : "";
        }
        el("tagsBox").addEventListener("click", (ev) => {
          const b = ev.target.closest("button[data-i]");
          if (b) {
            tags.splice(Number(b.dataset.i), 1);
            renderTags();
            atualizar();
          } else el("tagInput").focus();
        });
        function addTag() {
          const input = el("tagInput");
          const t = input.value
            .trim()
            .toLowerCase()
            .replace(/^#/, "")
            .replace(/[^a-z0-9à-ú_-]/gi, "")
            .slice(0, 20);
          input.value = "";
          if (t && tags.length < 5 && !tags.includes(t)) {
            tags.push(t);
            renderTags();
            atualizar();
          }
        }
        el("tagInput").addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === ",") {
            ev.preventDefault();
            addTag();
          } else if (ev.key === "Backspace" && !ev.target.value && tags.length) {
            tags.pop();
            renderTags();
            atualizar();
          }
        });
        el("tagInput").addEventListener("blur", addTag);

        function dadosAtuais() {
          return {
            nome: campos.nome.value.trim(),
            url: normalizaUrl(campos.url.value),

            detalhes: campos.detalhes.value.trim(),
            repo: campos.repo.value.trim(),

        function validar() {

          return ok;

            <div class="preview-box" style="text-align:left;">${renderCardPreview(site)}</div>

                body: JSON.stringify({

                  tags: d.tags,
                }),
              });
              if (!res.ok) {
                const data = await res.json().catch(() => ({}));

              const site = await res.json();
              mostrarSucesso(Object.assign({}, d, site));
              return;
            } catch (err) {
              if (!(err instanceof TypeError)) {
                notificar("Não foi possível publicar o site.", "error");
                return;
              }
              hasServer = false;
            }
          }

          // busca a versão mais recente compartilhada antes de inserir, para não sobrescrever
          // sites que outras pessoas publicaram enquanto esta aba estava aberta
          if (cloudReady) {
            try {
              const data = await cloudGetSites();
              applyCloudComments(data);
              if (data && Array.isArray(data.sites)) {
                historico = data.sites;
              }
            } catch (err) {

            }
          }

          const novoSite = {
            id:
              "local_" +

        regForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const u = document.getElementById("ruser").value.trim();
          const p = document.getElementById("rpass").value.trim();
          const p2 = document.getElementById("rpass2").value.trim();

          if (p !== p2) {
            regMessage.style.color = "#ff6b6b";
            regMessage.textContent = "✗ Erro: as senhas não correspondem";
            return;
          }

          if (p.length < 3) {
            regMessage.style.color = "#ff6b6b";
            regMessage.textContent =
              "✗ Erro: a senha deve ter no mínimo 3 caracteres";
            return;
          }

          if (u.length < 3) {
            regMessage.style.color = "#ff6b6b";
            regMessage.textContent =
              "✗ Erro: o usuário deve ter no mínimo 3 caracteres";
            return;
          }

          if (hasServer) {
            try {
              const res = await fetch(apiUrl("/api/register"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p }),
              });
              if (!res.ok) {
                const error = await res.json().catch(() => ({}));
                regMessage.style.color = "#ff6b6b";
                regMessage.textContent =
                  "✗ Erro: " + (error.error || "não foi possível cadastrar");
                return;
              }
              regMessage.style.color = "#3ddc84";
              regMessage.textContent =
                "✓ Cadastro realizado com sucesso! Redirecionando para login...";
              setTimeout(() => loginBtn.click(), 2000);
              return;
            } catch (err) {
              if (!(err instanceof TypeError)) return;
              hasServer = false;
            }
          }

          // cadastro local
          const existe = usuarios.find(
            (usr) => usr.username.toLowerCase() === u.toLowerCase(),
          );
          if (existe) {
            regMessage.style.color = "#ff6b6b";
            regMessage.textContent = "✗ Erro: usuário já existe";
            return;
          }

          usuarios.push({
            username: u,
            passwordHash: hashSenha(p),
            createdAt: new Date().toISOString(),
          });
          saveUsuarios();
          renderPerfis();

          regMessage.style.color = "#3ddc84";
          regMessage.textContent =
            "✓ Cadastro realizado com sucesso! Redirecionando para login...";
          setTimeout(() => loginBtn.click(), 1500);
        });
      });

      // inicialização
      (async () => {
        try {
          hasServer = await tryDetectServer();
          if (hasServer) await syncFromServer();
        } catch (e) {
          console.error("Erro ao conectar ao servidor:", e);
          notificar("Não foi possível carregar os dados do servidor.", "error");
          hasServer = false;
        }

        if (!hasServer) {
          try {
            await initCloudSync();
          } catch (e) {
            console.error("Erro ao iniciar sincronização compartilhada:", e);
            cloudReady = false;
          }
        }

        try {
          updateUserStatus();
        } catch (e) {
          console.error("Erro ao atualizar status do usuário:", e);
        }

        try {
          renderPerfis();
        } catch (e) {
          console.error("Erro ao carregar perfis:", e);
        }

        if (token && username) {
          startRealtime();
        }
      })();
    </script>
